<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>retro-idle — Game Boy Emulator</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      transition: outline-color 120ms ease;
    }

    body.dragging {
      outline: 3px dashed var(--accent);
      outline-offset: -10px;
    }

    main {
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #screen {
      width: min(480px, 100%);
      aspect-ratio: 160 / 144;
      height: auto;
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 6px;
      image-rendering: pixelated;
      display: block;
    }

    .controls {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .file-label,
    button {
      font: inherit;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      cursor: pointer;
    }

    .file-label:hover,
    button:not(:disabled):hover {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.active {
      border-color: var(--accent);
      background: #0c4a6e;
    }

    .speed-controls {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }

    .speed-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-right: 2px;
    }

    .speed-btn {
      font-size: 0.825rem;
      padding: 5px 10px;
      min-width: 44px;
    }

    #rom-input,
    #sav-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #status {
      width: 100%;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
      min-height: 1.25em;
    }

    #auto-fight-status {
      width: 100%;
      text-align: center;
      font-size: 0.825rem;
      color: var(--accent);
      min-height: 1.2em;
    }

    .legend {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    kbd {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.75rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <h1>retro-idle</h1>
    <canvas id="screen" width="160" height="144"></canvas>

    <div class="controls">
      <label class="file-label" for="rom-input">Load ROM (.gb / .gbc)</label>
      <input type="file" id="rom-input" accept=".gb,.gbc" />
      <button type="button" id="toggle-play" disabled>Pause</button>
      <button type="button" id="reset-btn" disabled>Reset</button>
      <button type="button" id="save-state-btn" disabled>Save State</button>
      <button type="button" id="load-state-btn" disabled>Load State</button>
      <button type="button" id="export-sav-btn" disabled>Export .sav</button>
      <button type="button" id="import-sav-btn" disabled>Import .sav</button>
      <input type="file" id="sav-input" accept=".sav" />
      <button type="button" id="auto-fight-btn" disabled title="Pokémon Red/Blue only">Auto-Fight</button>
    </div>

    <div class="speed-controls" id="speed-controls" role="group" aria-label="Emulator speed">
      <span class="speed-label">Speed</span>
      <button type="button" class="speed-btn active" data-speed="1" aria-pressed="true">1x</button>
      <button type="button" class="speed-btn" data-speed="2" aria-pressed="false" title="Audio muted above 1x">2x</button>
      <button type="button" class="speed-btn" data-speed="4" aria-pressed="false" title="Audio muted above 1x">4x</button>
      <button type="button" class="speed-btn" data-speed="10" aria-pressed="false" title="Audio muted above 1x">10x</button>
      <button type="button" class="speed-btn" data-speed="20" aria-pressed="false" title="Audio muted above 1x">20x</button>
    </div>

    <div id="status">Drop a .gb / .gbc ROM anywhere or click Load ROM.</div>
    <div id="auto-fight-status" hidden></div>

    <p class="legend">
      D-Pad: <kbd>Arrows</kbd> or <kbd>WASD</kbd> &middot;
      A: <kbd>X</kbd> &middot;
      B: <kbd>Z</kbd> &middot;
      Start: <kbd>Enter</kbd> &middot;
      Select: <kbd>Shift</kbd> &middot;
      Speed: <kbd>1</kbd>&ndash;<kbd>5</kbd> &middot;
      Gamepad supported
    </p>
  </main>

  <script src="./vendor/binjgb/binjgb.js"></script>
  <script type="module">
    import { createAutoFight, isPokemonRedBlueTitle, readPokemonRedSnapshot } from './autofight.js';

    const SCREEN_WIDTH = 160;
    const SCREEN_HEIGHT = 144;
    const AUDIO_FRAMES = 4096;
    const AUDIO_LATENCY_SEC = 0.1;
    const MAX_UPDATE_SEC = 5 / 60;
    const MAX_TURBO_STEP_MS = 12;
    const CPU_TICKS_PER_SECOND = 4194304;
    const SPEED_OPTIONS = [1, 2, 4, 10, 20];
    const SPEED_KEY_MAP = {
      Digit1: 1,
      Numpad1: 1,
      Digit2: 2,
      Numpad2: 2,
      Digit3: 4,
      Numpad3: 4,
      Digit4: 10,
      Numpad4: 10,
      Digit5: 20,
      Numpad5: 20,
    };
    const EVENT_NEW_FRAME = 1;
    const EVENT_AUDIO_BUFFER_FULL = 2;
    const EVENT_UNTIL_TICKS = 4;

    const DB_NAME = 'retro-idle';
    const STORE_NAME = 'kv';
    const LAST_ROM_KEY = 'lastRom';
    const UNLOAD_KEY = 'retro-idle:unload';

    const CARTRIDGE_TYPES = {
      0x00: 'ROM ONLY',
      0x01: 'MBC1',
      0x02: 'MBC1 + RAM',
      0x03: 'MBC1 + RAM + BATTERY',
      0x05: 'MBC2',
      0x06: 'MBC2 + BATTERY',
      0x0f: 'MBC3 + TIMER + BATTERY',
      0x10: 'MBC3 + TIMER + RAM + BATTERY',
      0x11: 'MBC3',
      0x12: 'MBC3 + RAM',
      0x13: 'MBC3 + RAM + BATTERY',
      0x19: 'MBC5',
      0x1a: 'MBC5 + RAM',
      0x1b: 'MBC5 + RAM + BATTERY',
      0x1c: 'MBC5 + RUMBLE',
      0x1d: 'MBC5 + RUMBLE + RAM',
      0x1e: 'MBC5 + RUMBLE + RAM + BATTERY',
    };

    const KEY_MAP = {
      ArrowUp: 'up',
      KeyW: 'up',
      ArrowDown: 'down',
      KeyS: 'down',
      ArrowLeft: 'left',
      KeyA: 'left',
      ArrowRight: 'right',
      KeyD: 'right',
      KeyX: 'a',
      KeyZ: 'b',
      Enter: 'start',
      ShiftLeft: 'select',
      ShiftRight: 'select',
      Tab: 'select',
    };

    const INPUT_TAGS = new Set(['INPUT', 'TEXTAREA', 'SELECT', 'OPTION', 'BUTTON']);

    const canvas = document.getElementById('screen');
    const romInput = document.getElementById('rom-input');
    const togglePlayBtn = document.getElementById('toggle-play');
    const resetBtn = document.getElementById('reset-btn');
    const saveStateBtn = document.getElementById('save-state-btn');
    const loadStateBtn = document.getElementById('load-state-btn');
    const exportSavBtn = document.getElementById('export-sav-btn');
    const importSavBtn = document.getElementById('import-sav-btn');
    const savInput = document.getElementById('sav-input');
    const autoFightBtn = document.getElementById('auto-fight-btn');
    const autoFightStatusEl = document.getElementById('auto-fight-status');
    const speedButtons = Array.from(document.querySelectorAll('.speed-btn'));
    const statusEl = document.getElementById('status');

    let binjgb;
    let audioCtx = null;
    let audioGain = null;
    let emu = null;
    let currentSpeed = 1;
    let currentRomBytes = null;
    let currentRomId = '';
    let currentRomTitle = '';
    let currentHeaderText = '';
    let hasManualSave = false;
    let isBusy = false;
    let sramFlushTimer = 0;

    const autoFight = createAutoFight();
    let lastAutoFightText = '';
    const heldKeys = new Set();

    function getAudioContext() {
      if (!audioCtx) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (Ctor) {
          audioCtx = new Ctor();
          audioGain = audioCtx.createGain();
          audioGain.gain.value = currentSpeed === 1 ? 1 : 0;
          audioGain.connect(audioCtx.destination);
        }
      }
      return audioCtx;
    }

    function syncAudioGain() {
      if (audioCtx && audioGain) {
        audioGain.gain.setValueAtTime(currentSpeed === 1 ? 1 : 0, audioCtx.currentTime);
      }
    }

    function resumeAudioSafely() {
      const ctx = getAudioContext();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
    }

    function blurActiveElement() {
      if (document.activeElement instanceof HTMLElement) {
        document.activeElement.blur();
      }
    }

    function bytesToBase64(bytes) {
      const chunks = [];
      for (let i = 0; i < bytes.length; i += 0x8000) {
        chunks.push(String.fromCharCode(...bytes.subarray(i, i + 0x8000)));
      }
      return btoa(chunks.join(''));
    }

    function base64ToBytes(b64) {
      return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    }

    const CRC_TABLE = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_TABLE[i] = c >>> 0;
    }
    function crc32Hex(bytes) {
      let crc = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
      return ((crc ^ 0xffffffff) >>> 0).toString(16).padStart(8, '0');
    }

    function parseRomHeader(bytes) {
      if (!bytes || bytes.length < 0x0150) return null;
      let title = '';
      for (let i = 0x0134; i <= 0x0142; i++) {
        const ch = bytes[i];
        if (ch === 0) break;
        if (ch >= 0x20 && ch <= 0x7e) title += String.fromCharCode(ch);
      }
      title = title.trim() || 'UNKNOWN';
      const typeCode = bytes[0x0147];
      const mbc = CARTRIDGE_TYPES[typeCode] || `TYPE 0x${typeCode.toString(16).padStart(2, '0').toUpperCase()}`;
      return { title, mbc, typeCode };
    }

    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(STORE_NAME)) {
            req.result.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function withDb(mode, fn, fallback = null) {
      let db;
      try {
        db = await openDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, mode);
          let result;
          const req = fn(tx.objectStore(STORE_NAME));
          if (req) req.onsuccess = () => { result = req.result; };
          tx.oncomplete = () => resolve(result ?? null);
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        });
      } catch (err) {
        console.warn('IndexedDB error:', err);
        return fallback;
      } finally {
        db?.close();
      }
    }

    const dbGet = (key) => withDb('readonly', (s) => s.get(key));
    const dbPut = (key, value) => withDb('readwrite', (s) => s.put(value, key));
    const dbDelete = (key) => withDb('readwrite', (s) => s.delete(key));

    class BinjgbEmulator {
      constructor(module, romBytes, extRamBytes, canvasEl, { onExtRamUpdated, onFrame, speed = 1 } = {}) {
        this.module = module;
        this.onExtRamUpdated = onExtRamUpdated;
        this.onFrame = onFrame;
        const parsedSpeed = Number(speed);
        this.speed = Number.isFinite(parsedSpeed) && parsedSpeed > 0 ? parsedSpeed : 1;
        this.overrideButtons = null;
        this.ctx = canvasEl.getContext('2d');
        this.imageData = this.ctx.createImageData(SCREEN_WIDTH, SCREEN_HEIGHT);

        const alignedSize = (romBytes.byteLength + 0x7fff) & ~0x7fff;
        this.romPtr = module._malloc(alignedSize);
        new Uint8Array(module.HEAP8.buffer, this.romPtr, alignedSize).fill(0);
        new Uint8Array(module.HEAP8.buffer, this.romPtr, alignedSize).set(romBytes);

        const sampleRate = getAudioContext()?.sampleRate || 44100;
        this.e = module._emulator_new_simple(this.romPtr, alignedSize, sampleRate, AUDIO_FRAMES, 2);
        if (this.e === 0) {
          module._free(this.romPtr);
          this.romPtr = 0;
          throw new Error('Invalid ROM');
        }

        this.joypadPtr = module._joypad_new();
        module._emulator_set_default_joypad_callback(this.e, this.joypadPtr);

        this.sramSize = this.withFileData(module._ext_ram_file_data_new(this.e), (_, buf) => buf.byteLength);
        if (extRamBytes && this.sramSize > 0) {
          this.loadExtRam(extRamBytes);
        }

        this.rafId = 0;
        this.lastSec = 0;
        this.leftoverTicks = 0;
        this.audioStartSec = 0;
        this.destroyed = false;
        this.lastButtons = {};
        for (const [k, fn] of Object.entries(this.getJoypadSetters())) {
          this.lastButtons[k] = false;
          fn(this.e, 0);
        }
      }

      getJoypadSetters() {
        return {
          up: this.module._set_joyp_up,
          down: this.module._set_joyp_down,
          left: this.module._set_joyp_left,
          right: this.module._set_joyp_right,
          a: this.module._set_joyp_A,
          b: this.module._set_joyp_B,
          start: this.module._set_joyp_start,
          select: this.module._set_joyp_select,
        };
      }

      get isPaused() {
        return this.rafId === 0;
      }

      get isPlaying() {
        return !this.destroyed && this.rafId !== 0;
      }

      withFileData(fileDataPtr, fn) {
        const ptr = this.module._get_file_data_ptr(fileDataPtr);
        const size = this.module._get_file_data_size(fileDataPtr);
        try {
          return fn(fileDataPtr, new Uint8Array(this.module.HEAP8.buffer, ptr, size));
        } finally {
          this.module._file_data_delete(fileDataPtr);
          this.module._free(fileDataPtr);
        }
      }

      getSaveState() {
        return this.withFileData(this.module._state_file_data_new(this.e), (ptr, buf) => {
          this.module._emulator_write_state(this.e, ptr);
          return new Uint8Array(buf);
        });
      }

      loadState(stateBytes) {
        return this.withFileData(this.module._state_file_data_new(this.e), (ptr, buf) => {
          if (!stateBytes || buf.byteLength !== stateBytes.byteLength) return false;
          buf.set(stateBytes);
          this.module._emulator_read_state(this.e, ptr);
          this.leftoverTicks = 0;
          this.audioStartSec = 0;
          return true;
        });
      }

      getTicks() {
        return this.destroyed || !this.e ? 0 : this.module._emulator_get_ticks_f64(this.e);
      }

      setSpeed(speed) {
        const next = Number(speed);
        if (!Number.isFinite(next) || next <= 0 || next === this.speed) return;
        this.speed = next;
        this.leftoverTicks = 0;
        this.audioStartSec = 0;
      }

      getExtRam() {
        if (this.sramSize === 0) return new Uint8Array();
        return this.withFileData(this.module._ext_ram_file_data_new(this.e), (ptr, buf) => {
          this.module._emulator_write_ext_ram(this.e, ptr);
          return new Uint8Array(buf);
        });
      }

      loadExtRam(ramBytes) {
        if (this.sramSize === 0 || !ramBytes) return;
        this.withFileData(this.module._ext_ram_file_data_new(this.e), (ptr, buf) => {
          buf.fill(0);
          buf.set(ramBytes.subarray(0, buf.byteLength));
          this.module._emulator_read_ext_ram(this.e, ptr);
        });
      }

      readMem(addr) {
        return this.module._emulator_read_mem(this.e, addr) & 0xff;
      }

      setOverrideButtons(btns) {
        this.overrideButtons = btns;
        this.syncInput();
      }

      syncInput() {
        let next;
        if (this.overrideButtons) {
          next = { ...this.overrideButtons };
        } else {
          next = {
            up: heldKeys.has('up'),
            down: heldKeys.has('down'),
            left: heldKeys.has('left'),
            right: heldKeys.has('right'),
            a: heldKeys.has('a'),
            b: heldKeys.has('b'),
            start: heldKeys.has('start'),
            select: heldKeys.has('select'),
          };

          const pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (const pad of pads) {
            if (!pad || !pad.connected) continue;
            const b = pad.buttons || [];
            const ax = pad.axes || [];
            const pressed = (idx) => Boolean(b[idx] && (b[idx].pressed || b[idx].value > 0.5));
            next.a ||= pressed(0);
            next.b ||= pressed(1);
            next.select ||= pressed(8);
            next.start ||= pressed(9);
            next.up ||= pressed(12) || (ax[1] ?? 0) < -0.5;
            next.down ||= pressed(13) || (ax[1] ?? 0) > 0.5;
            next.left ||= pressed(14) || (ax[0] ?? 0) < -0.5;
            next.right ||= pressed(15) || (ax[0] ?? 0) > 0.5;
            break;
          }
        }

        const setters = this.getJoypadSetters();
        for (const k of Object.keys(next)) {
          if (next[k] !== this.lastButtons[k]) {
            this.lastButtons[k] = next[k];
            setters[k](this.e, next[k] ? 1 : 0);
          }
        }
      }

      pushAudio() {
        if (this.speed !== 1) return;
        const ctx = getAudioContext();
        if (!ctx || ctx.state !== 'running') return;
        const ptr = this.module._get_audio_buffer_ptr(this.e);
        const cap = this.module._get_audio_buffer_capacity(this.e);
        const samples = new Uint8Array(this.module.HEAP8.buffer, ptr, cap);
        const nowSec = ctx.currentTime;
        const nowPlusLatency = nowSec + AUDIO_LATENCY_SEC;
        this.audioStartSec = this.audioStartSec || nowPlusLatency;
        if (this.audioStartSec >= nowSec) {
          const buffer = ctx.createBuffer(2, AUDIO_FRAMES, ctx.sampleRate);
          const ch0 = buffer.getChannelData(0);
          const ch1 = buffer.getChannelData(1);
          for (let i = 0; i < AUDIO_FRAMES; i++) {
            ch0[i] = (samples[2 * i] * 0.5) / 255;
            ch1[i] = (samples[2 * i + 1] * 0.5) / 255;
          }
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          src.connect(audioGain || ctx.destination);
          src.start(this.audioStartSec);
          this.audioStartSec += AUDIO_FRAMES / ctx.sampleRate;
        } else {
          this.audioStartSec = nowPlusLatency;
        }
      }

      captureFrame() {
        const ptr = this.module._get_frame_buffer_ptr(this.e);
        const size = this.module._get_frame_buffer_size(this.e);
        const fb = new Uint8Array(this.module.HEAP8.buffer, ptr, size);
        this.imageData.data.set(fb);
      }

      presentFrame() {
        this.ctx.putImageData(this.imageData, 0, 0);
      }

      renderFrame() {
        this.captureFrame();
        this.presentFrame();
      }

      stepFrame = (ms) => {
        if (this.destroyed || this.rafId === 0) return;
        this.rafId = requestAnimationFrame(this.stepFrame);
        this.syncInput();

        const sec = ms / 1000;
        const deltaSec = Math.max(sec - (this.lastSec || sec), 0);
        this.lastSec = sec;

        const startTicks = this.module._emulator_get_ticks_f64(this.e);
        const deltaTicks = Math.min(deltaSec, MAX_UPDATE_SEC) * CPU_TICKS_PER_SECOND * this.speed;
        const untilTicks = startTicks + deltaTicks - this.leftoverTicks;
        const deadlineMs = this.speed > 1 ? performance.now() + MAX_TURBO_STEP_MS : Infinity;
        let hasNewFrame = false;
        let budgetExceeded = false;

        while (true) {
          const ev = this.module._emulator_run_until_f64(this.e, untilTicks);
          if (ev & EVENT_NEW_FRAME) {
            this.captureFrame();
            hasNewFrame = true;
            this.onFrame?.();
            if (this.destroyed || this.rafId === 0) break;
          }
          if (ev & EVENT_AUDIO_BUFFER_FULL) this.pushAudio();
          if ((ev & EVENT_UNTIL_TICKS) || ev === 0) break;
          if (performance.now() >= deadlineMs) {
            budgetExceeded = true;
            break;
          }
        }
        if (this.destroyed) return;
        if (hasNewFrame) this.presentFrame();
        this.leftoverTicks =
          budgetExceeded || this.rafId === 0
            ? 0
            : (this.module._emulator_get_ticks_f64(this.e) - untilTicks) | 0;

        if (this.module._emulator_was_ext_ram_updated(this.e)) {
          this.onExtRamUpdated?.();
        }
      };

      resume() {
        if (this.destroyed || this.rafId !== 0) return;
        this.lastSec = 0;
        this.audioStartSec = 0;
        resumeAudioSafely();
        this.rafId = requestAnimationFrame(this.stepFrame);
      }

      pause() {
        if (this.rafId !== 0) {
          cancelAnimationFrame(this.rafId);
          this.rafId = 0;
        }
        this.audioStartSec = 0;
        if (audioCtx && audioCtx.state === 'running') {
          audioCtx.suspend().catch(() => {});
        }
      }

      destroy() {
        if (this.destroyed) return;
        this.pause();
        this.destroyed = true;
        if (this.e) {
          this.module._emulator_delete(this.e);
          this.e = 0;
        }
        if (this.joypadPtr) {
          this.module._joypad_delete(this.joypadPtr);
          this.joypadPtr = 0;
        }
        if (this.romPtr) {
          this.module._free(this.romPtr);
          this.romPtr = 0;
        }
      }
    }

    function setAutoFightStatus(text) {
      if (text === lastAutoFightText) return;
      lastAutoFightText = text;
      autoFightStatusEl.textContent = text;
      autoFightStatusEl.hidden = !text;
    }

    function setSpeed(speed) {
      const next = Number(speed);
      if (!SPEED_OPTIONS.includes(next)) return;
      currentSpeed = next;
      emu?.setSpeed(currentSpeed);
      syncAudioGain();
      for (const btn of speedButtons) {
        const active = Number(btn.dataset.speed) === currentSpeed;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      }
    }

    function syncAutoFightButton() {
      const supported = Boolean(emu) && isPokemonRedBlueTitle(currentRomTitle);
      const active = autoFight.getState().active;
      autoFightBtn.disabled = !supported || isBusy;
      autoFightBtn.textContent = active ? 'Stop Auto-Fight' : 'Auto-Fight';
      autoFightBtn.classList.toggle('active', active);
    }

    function stopAutoFight(reason = null) {
      autoFight.stop(reason || 'manual');
      emu?.setOverrideButtons(null);
      syncAutoFightButton();
      setAutoFightStatus(reason && reason !== 'manual' ? `Auto-Fight stopped: ${reason}` : '');
    }

    function stepAutoFight() {
      if (!emu || !autoFight.getState().active) return;
      const snap = readPokemonRedSnapshot((a) => emu.readMem(a));
      const res = autoFight.step(snap);
      if (!res.active) {
        stopAutoFight(res.stopReason);
        return;
      }
      emu.setOverrideButtons(res.buttons);
      setAutoFightStatus(`Auto-Fight: ${res.phase}...`);
    }

    function startAutoFight() {
      if (!emu || isBusy || !isPokemonRedBlueTitle(currentRomTitle)) return;
      if (emu.isPaused) {
        emu.resume();
        syncControls();
      }
      const snap = readPokemonRedSnapshot((a) => emu.readMem(a));
      autoFight.start(snap);
      syncAutoFightButton();
      stepAutoFight();
      blurActiveElement();
    }

    function setActionButtonsDisabled() {
      const loaded = Boolean(emu);
      togglePlayBtn.disabled = !loaded || isBusy;
      resetBtn.disabled = !loaded || isBusy;
      saveStateBtn.disabled = !loaded || isBusy;
      loadStateBtn.disabled = !loaded || !hasManualSave || isBusy;
      const canUseSav = loaded && emu.sramSize > 0 && !isBusy;
      exportSavBtn.disabled = !canUseSav;
      importSavBtn.disabled = !canUseSav;
      syncAutoFightButton();
    }

    function syncControls(statusSuffix = '') {
      setActionButtonsDisabled();
      if (!emu) {
        togglePlayBtn.textContent = 'Pause';
        return;
      }
      const playing = emu.isPlaying;
      togglePlayBtn.textContent = playing ? 'Pause' : 'Resume';
      statusEl.textContent = `${playing ? 'Playing' : 'Paused'}: ${currentHeaderText}${statusSuffix}`;
    }

    function scheduleSramFlush() {
      if (!emu || !currentRomId || emu.sramSize === 0) return;
      clearTimeout(sramFlushTimer);
      sramFlushTimer = setTimeout(() => {
        if (emu && currentRomId && emu.sramSize > 0) {
          dbPut(`sram:${currentRomId}`, emu.getExtRam());
        }
      }, 500);
    }

    async function flushEmulatorPersistence() {
      if (!emu || !currentRomId) return;
      clearTimeout(sramFlushTimer);
      const writes = [dbPut(`autoState:${currentRomId}`, emu.getSaveState())];
      if (emu.sramSize > 0) {
        writes.push(dbPut(`sram:${currentRomId}`, emu.getExtRam()));
      }
      await Promise.all(writes);
    }

    function writeUnloadSnapshot() {
      if (!emu || !currentRomId) return;
      try {
        const sram = emu.sramSize > 0 ? emu.getExtRam() : new Uint8Array();
        localStorage.setItem(
          UNLOAD_KEY,
          JSON.stringify({
            romId: currentRomId,
            state: bytesToBase64(emu.getSaveState()),
            sram: sram.length ? bytesToBase64(sram) : '',
          })
        );
      } catch (err) {
        console.warn('Could not write unload snapshot:', err);
      }
    }

    function clearPendingUnloadFor(romId) {
      try {
        const raw = localStorage.getItem(UNLOAD_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed?.romId === romId) {
          localStorage.removeItem(UNLOAD_KEY);
        }
      } catch {
        localStorage.removeItem(UNLOAD_KEY);
      }
    }

    async function consumePendingUnload() {
      try {
        const raw = localStorage.getItem(UNLOAD_KEY);
        if (!raw) return;
        localStorage.removeItem(UNLOAD_KEY);
        const parsed = JSON.parse(raw);
        if (!parsed?.romId || !parsed?.state) return;
        await dbPut(`autoState:${parsed.romId}`, base64ToBytes(parsed.state));
        if (parsed.sram) {
          await dbPut(`sram:${parsed.romId}`, base64ToBytes(parsed.sram));
        }
      } catch (err) {
        console.warn('Could not restore pending unload snapshot:', err);
      }
    }

    async function loadRom(romSource, fileName, { persist = false } = {}) {
      if (!romSource || isBusy) return;
      const label = fileName || (romSource instanceof File ? romSource.name : 'ROM');
      let loadStatusSuffix = '';
      isBusy = true;
      setActionButtonsDisabled();
      statusEl.textContent = `Loading ${label}...`;

      try {
        resumeAudioSafely();
        if (String(label).toLowerCase().endsWith('.zip')) {
          throw new Error('Please unzip the .gb / .gbc file first');
        }

        let romBytes;
        if (romSource instanceof Uint8Array) {
          romBytes = romSource;
        } else if (romSource instanceof Blob) {
          romBytes = new Uint8Array(await romSource.arrayBuffer());
        } else {
          const res = await fetch(romSource);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          romBytes = new Uint8Array(await res.arrayBuffer());
        }

        stopAutoFight();
        await flushEmulatorPersistence();
        await consumePendingUnload();

        if (emu) {
          emu.destroy();
          emu = null;
        }

        const header = parseRomHeader(romBytes);
        currentRomBytes = romBytes;
        currentRomId = crc32Hex(romBytes);
        currentRomTitle = header ? header.title : label;
        currentHeaderText = header ? `${header.title} (${header.mbc})` : label;

        const [sram, autoState, manualState] = await Promise.all([
          dbGet(`sram:${currentRomId}`),
          dbGet(`autoState:${currentRomId}`),
          dbGet(`manualState:${currentRomId}`),
        ]);
        hasManualSave = Boolean(manualState);

        emu = new BinjgbEmulator(binjgb, romBytes, sram, canvas, {
          onExtRamUpdated: scheduleSramFlush,
          onFrame: stepAutoFight,
          speed: currentSpeed,
        });

        if (autoState && emu.loadState(autoState)) {
          loadStatusSuffix = ' — resumed auto-save';
        }
        emu.resume();

        if (persist) {
          await dbPut(LAST_ROM_KEY, { bytes: romBytes, name: label, savedAt: Date.now() });
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = `Failed to load ROM: ${err?.message || err}`;
      } finally {
        isBusy = false;
        if (emu && !statusEl.textContent.startsWith('Failed')) {
          syncControls(loadStatusSuffix);
        } else {
          setActionButtonsDisabled();
        }
        blurActiveElement();
      }
    }

    async function runTransportAction(action) {
      if (isBusy || !emu) return;
      isBusy = true;
      setActionButtonsDisabled();
      let statusSuffix = '';
      let hadError = false;
      try {
        resumeAudioSafely();
        statusSuffix = (await action()) || '';
      } catch (err) {
        hadError = true;
        console.error(err);
        statusEl.textContent = `Action failed: ${err?.message || err}`;
      } finally {
        isBusy = false;
        if (hadError) {
          setActionButtonsDisabled();
        } else {
          syncControls(statusSuffix);
        }
        blurActiveElement();
      }
    }

    romInput.addEventListener('change', async () => {
      const file = romInput.files?.[0];
      romInput.value = '';
      if (file) {
        await loadRom(file, file.name, { persist: true });
      } else {
        blurActiveElement();
      }
    });

    togglePlayBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        if (emu.isPlaying) {
          stopAutoFight();
          emu.pause();
          await flushEmulatorPersistence();
        } else {
          emu.resume();
        }
      })
    );

    async function rebootWithSram(sramBytes) {
      stopAutoFight();
      clearTimeout(sramFlushTimer);
      if (sramBytes) await dbPut(`sram:${currentRomId}`, sramBytes);
      await dbDelete(`autoState:${currentRomId}`);
      clearPendingUnloadFor(currentRomId);
      emu.destroy();
      emu = new BinjgbEmulator(binjgb, currentRomBytes, sramBytes, canvas, {
        onExtRamUpdated: scheduleSramFlush,
        onFrame: stepAutoFight,
        speed: currentSpeed,
      });
      emu.resume();
    }

    resetBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        const sram = emu.sramSize > 0 ? emu.getExtRam() : null;
        await rebootWithSram(sram);
      })
    );

    saveStateBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        await dbPut(`manualState:${currentRomId}`, emu.getSaveState());
        hasManualSave = true;
        return ' — state saved';
      })
    );

    loadStateBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        stopAutoFight();
        const state = await dbGet(`manualState:${currentRomId}`);
        if (!state || !emu.loadState(state)) {
          hasManualSave = false;
          throw new Error('No compatible manual save state found');
        }
        emu.resume();
        return ' — state loaded';
      })
    );

    for (const btn of speedButtons) {
      btn.addEventListener('click', () => {
        resumeAudioSafely();
        setSpeed(Number(btn.dataset.speed));
        blurActiveElement();
      });
    }

    autoFightBtn.addEventListener('click', () => {
      if (!emu || isBusy || !isPokemonRedBlueTitle(currentRomTitle)) return;
      resumeAudioSafely();
      if (autoFight.getState().active) {
        stopAutoFight('manual');
      } else {
        startAutoFight();
      }
      blurActiveElement();
    });

    exportSavBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        if (emu.sramSize <= 0) {
          throw new Error('Cartridge has no battery RAM');
        }
        const ramBytes = emu.getExtRam();
        const safeTitle = (currentRomTitle || 'save').replace(/[^a-zA-Z0-9._-]+/g, '_');
        const url = URL.createObjectURL(new Blob([ramBytes], { type: 'application/octet-stream' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `${safeTitle}.sav`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return ' — exported .sav';
      })
    );

    importSavBtn.addEventListener('click', () => {
      if (isBusy || !emu || emu.sramSize <= 0) return;
      blurActiveElement();
      savInput.click();
    });

    savInput.addEventListener('change', async () => {
      const file = savInput.files?.[0];
      savInput.value = '';
      if (!file) {
        blurActiveElement();
        return;
      }
      await runTransportAction(async () => {
        if (emu.sramSize <= 0) {
          throw new Error('Cartridge has no battery RAM');
        }
        const raw = new Uint8Array(await file.arrayBuffer());
        if (raw.length === 0 || raw.length > 0x40000) {
          throw new Error('Invalid .sav file size');
        }
        const normalized = new Uint8Array(emu.sramSize);
        normalized.set(raw.subarray(0, emu.sramSize));
        await rebootWithSram(normalized);
        return ' — imported .sav';
      });
    });

    window.addEventListener('keydown', (e) => {
      resumeAudioSafely();
      if (e.code === 'Escape' && autoFight.getState().active) {
        stopAutoFight('manual');
        e.preventDefault();
        return;
      }
      const speedChoice = SPEED_KEY_MAP[e.code];
      if (
        speedChoice &&
        !e.ctrlKey &&
        !e.altKey &&
        !e.metaKey &&
        !(document.activeElement && INPUT_TAGS.has(document.activeElement.tagName))
      ) {
        setSpeed(speedChoice);
        e.preventDefault();
        return;
      }
      const btn = KEY_MAP[e.code];
      if (!btn || e.ctrlKey || e.altKey || e.metaKey) return;
      if (document.activeElement && INPUT_TAGS.has(document.activeElement.tagName)) return;
      heldKeys.add(btn);
      e.preventDefault();
    });

    window.addEventListener('keyup', (e) => {
      const btn = KEY_MAP[e.code];
      if (!btn) return;
      heldKeys.delete(btn);
    });

    window.addEventListener('blur', () => heldKeys.clear());
    window.addEventListener('pointerdown', resumeAudioSafely, { passive: true });
    window.addEventListener('pagehide', writeUnloadSnapshot);
    window.addEventListener('beforeunload', writeUnloadSnapshot);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        if (autoFight.getState().active) {
          stopAutoFight();
        }
        writeUnloadSnapshot();
        if (emu && emu.isPlaying && !isBusy) {
          emu.pause();
          syncControls();
          flushEmulatorPersistence();
        }
      }
    });

    let dragDepth = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragDepth++;
      document.body.classList.add('dragging');
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) document.body.classList.remove('dragging');
    });
    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragDepth = 0;
      document.body.classList.remove('dragging');
      const file = e.dataTransfer?.files?.[0];
      if (file) await loadRom(file, file.name, { persist: true });
    });

    try {
      binjgb = await Binjgb({ locateFile: (path) => `./vendor/binjgb/${path}` });
    } catch (err) {
      console.error(err);
      statusEl.textContent = `Failed to initialize emulator: ${err?.message || err}`;
      throw err;
    }

    const params = new URLSearchParams(window.location.search);
    const romUrl = params.get('rom');
    if (romUrl) {
      loadRom(romUrl, romUrl.split('/').pop());
    } else {
      dbGet(LAST_ROM_KEY).then((record) => {
        if (record?.bytes && record?.name && !emu) {
          loadRom(new File([record.bytes], record.name), record.name);
        }
      });
    }

    window.__retroIdle = {
      getEmulator: () => emu,
      loadRom,
      getSpeed: () => currentSpeed,
      setSpeed,
      getAutoFight: () => ({
        ...autoFight.getState(),
        start: startAutoFight,
        stop: stopAutoFight,
        snapshot: () => (emu ? readPokemonRedSnapshot((a) => emu.readMem(a)) : null),
      }),
    };
  </script>
</body>
</html>
