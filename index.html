<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="retro-idle" />
  <title>retro-idle — Game Boy Emulator</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      touch-action: manipulation;
      transition: outline-color 120ms ease;
    }

    button,
    .file-label,
    .touch-gamepad,
    .touch-gamepad * {
      -webkit-tap-highlight-color: transparent;
    }

    body.dragging {
      outline: 3px dashed var(--accent);
      outline-offset: -10px;
    }

    main {
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .screen-slot {
      width: min(480px, 100%);
      aspect-ratio: 160 / 144;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #screen {
      width: 100%;
      height: 100%;
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 6px;
      image-rendering: pixelated;
      display: block;
    }

    .pip-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      background: #0f172a;
      border: 2px dashed var(--border);
      border-radius: 6px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }

    .pip-placeholder[hidden] {
      display: none;
    }

    .pip-placeholder p {
      margin: 0;
    }

    .controls {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .file-label,
    button {
      font: inherit;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      cursor: pointer;
    }

    .file-label:hover,
    button:not(:disabled):hover {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.active {
      border-color: var(--accent);
      background: #0c4a6e;
    }

    .speed-controls {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }

    .speed-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-right: 2px;
    }

    .speed-btn {
      font-size: 0.825rem;
      padding: 5px 10px;
      min-width: 44px;
    }

    #rom-input,
    #sav-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #status {
      width: 100%;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
      min-height: 1.25em;
    }

    #auto-fight-status {
      width: 100%;
      text-align: center;
      font-size: 0.825rem;
      color: var(--accent);
      min-height: 1.2em;
    }

    #auto-fight-status.error {
      color: #f87171;
    }

    #heal-center-status {
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.15em;
    }

    #heal-center-status.linked {
      color: #34d399;
    }

    .legend {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    kbd {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.75rem;
      color: var(--text);
    }

    .touch-gamepad {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "dpad ab"
        "meta meta";
      align-items: center;
      justify-items: center;
      row-gap: 14px;
      column-gap: 12px;
      width: 100%;
      padding: 6px 4px 2px;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .pad-left {
      grid-area: dpad;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pad-right {
      grid-area: ab;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pad-center {
      grid-area: meta;
      display: flex;
      gap: 18px;
      justify-content: center;
      align-items: center;
    }

    .dpad {
      --dpad-size: 138px;
      --dpad-arm: 46px;
      position: relative;
      width: var(--dpad-size);
      height: var(--dpad-size);
      touch-action: none;
    }

    .dpad-arm {
      position: absolute;
      display: grid;
      place-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1;
      pointer-events: none;
      transition: background-color 60ms ease, border-color 60ms ease, color 60ms ease;
    }

    .dpad-up {
      top: 0;
      left: var(--dpad-arm);
      width: var(--dpad-arm);
      height: calc(var(--dpad-arm) + 2px);
      border-radius: 8px 8px 0 0;
    }

    .dpad-down {
      bottom: 0;
      left: var(--dpad-arm);
      width: var(--dpad-arm);
      height: calc(var(--dpad-arm) + 2px);
      border-radius: 0 0 8px 8px;
    }

    .dpad-left {
      left: 0;
      top: var(--dpad-arm);
      width: calc(var(--dpad-arm) + 2px);
      height: var(--dpad-arm);
      border-radius: 8px 0 0 8px;
    }

    .dpad-right {
      right: 0;
      top: var(--dpad-arm);
      width: calc(var(--dpad-arm) + 2px);
      height: var(--dpad-arm);
      border-radius: 0 8px 8px 0;
    }

    .dpad-center {
      position: absolute;
      top: var(--dpad-arm);
      left: var(--dpad-arm);
      width: var(--dpad-arm);
      height: var(--dpad-arm);
      background: #1e293b;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .dpad-center::after {
      content: '';
      width: 48%;
      height: 48%;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid #334155;
    }

    .dpad-arm.pressed {
      background: #0c4a6e;
      border-color: var(--accent);
      color: #f8fafc;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    }

    .ab-cluster {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .gb-action-btn {
      width: 60px;
      height: 60px;
      padding: 0;
      border-radius: 50%;
      font-weight: 700;
      font-size: 1.05rem;
      touch-action: none;
      background: #7f1d1d;
      border: 2px solid #b91c1c;
      color: #fecaca;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35);
      transition: transform 60ms ease, background-color 60ms ease, border-color 60ms ease;
    }

    .gb-action-btn:not(:disabled):hover {
      border-color: #ef4444;
    }

    .gb-btn-b {
      margin-top: 24px;
    }

    .gb-btn-a {
      margin-bottom: 24px;
    }

    .gb-action-btn.pressed {
      background: #dc2626;
      border-color: #fca5a5;
      color: #ffffff;
      transform: scale(0.95);
    }

    .gb-meta-btn {
      min-width: 72px;
      min-height: 32px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      touch-action: none;
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--muted);
      transition: transform 60ms ease, background-color 60ms ease, border-color 60ms ease, color 60ms ease;
    }

    .gb-meta-btn.pressed {
      background: #0c4a6e;
      border-color: var(--accent);
      color: #f8fafc;
      transform: scale(0.95);
    }

    @media (pointer: coarse) {
      .legend {
        display: none;
      }
    }

    @media (max-width: 768px), (pointer: coarse) {
      body {
        padding:
          max(8px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));
        align-content: start;
      }

      main {
        width: 100%;
        padding: 12px;
        gap: 10px;
        border-radius: 10px;
      }

      h1 {
        order: 1;
        font-size: 0.95rem;
      }

      .screen-slot {
        order: 2;
        width: min(100%, calc((100dvh - 370px) * 160 / 144));
        min-width: min(100%, 240px);
      }

      #status {
        order: 3;
        font-size: 0.8rem;
      }

      #auto-fight-status {
        order: 4;
        font-size: 0.78rem;
      }

      #heal-center-status {
        order: 5;
        font-size: 0.76rem;
      }

      .touch-gamepad {
        order: 6;
      }

      .speed-controls {
        order: 7;
      }

      .controls {
        order: 8;
        gap: 6px;
      }

      .legend {
        order: 9;
      }

      .controls button,
      .controls .file-label {
        padding: 7px 11px;
        font-size: 0.82rem;
      }

      .speed-btn {
        padding: 5px 9px;
        min-width: 40px;
      }
    }

    @media (orientation: landscape) and (max-height: 540px) {
      body.touch-controls-visible {
        padding:
          max(4px, env(safe-area-inset-top))
          max(8px, env(safe-area-inset-right))
          max(6px, env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
        align-content: start;
      }

      body.touch-controls-visible main {
        width: 100%;
        max-width: 100%;
        padding: 4px 6px;
        background: transparent;
        border: none;
        border-radius: 0;
        display: grid;
        grid-template-columns: minmax(140px, 1fr) auto minmax(140px, 1fr);
        align-items: center;
        justify-items: center;
        column-gap: 10px;
        row-gap: 6px;
      }

      body.touch-controls-visible main > h1,
      body.touch-controls-visible main > .legend {
        display: none;
      }

      body.touch-controls-visible .screen-slot {
        grid-column: 2;
        grid-row: 1;
        order: initial;
        width: min(calc(100vw - 310px), calc((100dvh - 58px) * 160 / 144), 380px);
        min-width: 0;
        height: auto;
        aspect-ratio: 160 / 144;
      }

      body.touch-controls-visible .touch-gamepad {
        display: contents;
      }

      body.touch-controls-visible .pad-left {
        grid-column: 1;
        grid-row: 1;
      }

      body.touch-controls-visible .pad-right {
        grid-column: 3;
        grid-row: 1;
      }

      body.touch-controls-visible .pad-center {
        grid-column: 2;
        grid-row: 2;
        gap: 14px;
      }

      body.touch-controls-visible #status,
      body.touch-controls-visible #auto-fight-status,
      body.touch-controls-visible #heal-center-status,
      body.touch-controls-visible .speed-controls,
      body.touch-controls-visible .controls {
        grid-column: 1 / -1;
        order: initial;
      }
    }

    @media (orientation: landscape) and (max-height: 400px) {
      body.touch-controls-visible .dpad {
        --dpad-size: 126px;
        --dpad-arm: 42px;
      }

      body.touch-controls-visible .gb-action-btn {
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>retro-idle</h1>
    <div id="screen-slot" class="screen-slot">
      <canvas id="screen" width="160" height="144"></canvas>
      <div id="pip-placeholder" class="pip-placeholder" hidden>
        <p>Playing in Mini-Player</p>
        <button type="button" id="pip-return-btn">Return to Tab</button>
      </div>
    </div>

    <div class="controls">
      <label class="file-label" for="rom-input">Load ROM (.gb / .gbc)</label>
      <input type="file" id="rom-input" accept=".gb,.gbc" />
      <button type="button" id="toggle-play" disabled>Pause</button>
      <button type="button" id="reset-btn" disabled>Reset</button>
      <button type="button" id="save-state-btn" disabled>Save State</button>
      <button type="button" id="load-state-btn" disabled>Load State</button>
      <button type="button" id="export-sav-btn" disabled>Export .sav</button>
      <button type="button" id="import-sav-btn" disabled>Import .sav</button>
      <input type="file" id="sav-input" accept=".sav" />
      <button type="button" id="auto-fight-btn" disabled title="Pokémon Red / Blue / Yellow">Auto-Fight</button>
      <button type="button" id="touch-pad-btn" aria-pressed="false" title="Show or hide on-screen Game Boy controls">Touch Pad</button>
      <button type="button" id="mini-player-btn" disabled title="Pop out always-on-top mini-player (Chrome / Edge desktop)">Mini-Player</button>
    </div>

    <div class="speed-controls" id="speed-controls" role="group" aria-label="Emulator speed">
      <span class="speed-label">Speed</span>
      <button type="button" class="speed-btn active" data-speed="1" aria-pressed="true">1x</button>
      <button type="button" class="speed-btn" data-speed="2" aria-pressed="false" title="Audio muted above 1x">2x</button>
      <button type="button" class="speed-btn" data-speed="4" aria-pressed="false" title="Audio muted above 1x">4x</button>
      <button type="button" class="speed-btn" data-speed="10" aria-pressed="false" title="Audio muted above 1x">10x</button>
      <button type="button" class="speed-btn" data-speed="20" aria-pressed="false" title="Audio muted above 1x">20x</button>
    </div>

    <div id="status">Drop a .gb / .gbc ROM anywhere or click Load ROM.</div>
    <div id="auto-fight-status" hidden></div>
    <div id="heal-center-status" hidden></div>

    <section id="touch-gamepad" class="touch-gamepad" aria-label="Game Boy controls" hidden>
      <div class="pad-left">
        <div id="touch-dpad" class="dpad" role="group" aria-label="D-Pad">
          <div class="dpad-arm dpad-up" data-gb-btn="up" aria-hidden="true">&#9650;</div>
          <div class="dpad-arm dpad-down" data-gb-btn="down" aria-hidden="true">&#9660;</div>
          <div class="dpad-arm dpad-left" data-gb-btn="left" aria-hidden="true">&#9664;</div>
          <div class="dpad-arm dpad-right" data-gb-btn="right" aria-hidden="true">&#9654;</div>
          <div class="dpad-center" aria-hidden="true"></div>
        </div>
      </div>
      <div class="pad-right">
        <div class="ab-cluster">
          <button type="button" class="gb-action-btn gb-btn-b" data-gb-btn="b" aria-label="B button">B</button>
          <button type="button" class="gb-action-btn gb-btn-a" data-gb-btn="a" aria-label="A button">A</button>
        </div>
      </div>
      <div class="pad-center">
        <button type="button" class="gb-meta-btn" data-gb-btn="select">SELECT</button>
        <button type="button" class="gb-meta-btn" data-gb-btn="start">START</button>
      </div>
    </section>

    <p class="legend">
      D-Pad: <kbd>Arrows</kbd> or <kbd>WASD</kbd> &middot;
      A: <kbd>X</kbd> &middot;
      B: <kbd>Z</kbd> &middot;
      Start: <kbd>Enter</kbd> &middot;
      Select: <kbd>Shift</kbd> &middot;
      Speed: <kbd>1</kbd>&ndash;<kbd>5</kbd> &middot;
      Gamepad supported
    </p>
  </main>

  <script src="./vendor/binjgb/binjgb.js"></script>
  <script type="module">
    import {
      createAutoFight,
      getAutoFightProfile,
    } from './autofight.js';

    const SCREEN_WIDTH = 160;
    const SCREEN_HEIGHT = 144;
    const AUDIO_FRAMES = 4096;
    const AUDIO_LATENCY_SEC = 0.1;
    const MAX_UPDATE_SEC = 5 / 60;
    const MAX_TURBO_STEP_MS = 12;
    const CPU_TICKS_PER_SECOND = 4194304;
    const SPEED_OPTIONS = [1, 2, 4, 10, 20];
    const SPEED_KEY_MAP = {
      Digit1: 1,
      Numpad1: 1,
      Digit2: 2,
      Numpad2: 2,
      Digit3: 4,
      Numpad3: 4,
      Digit4: 10,
      Numpad4: 10,
      Digit5: 20,
      Numpad5: 20,
    };
    const EVENT_NEW_FRAME = 1;
    const EVENT_AUDIO_BUFFER_FULL = 2;
    const EVENT_UNTIL_TICKS = 4;

    const DB_NAME = 'retro-idle';
    const STORE_NAME = 'kv';
    const LAST_ROM_KEY = 'lastRom';
    const UNLOAD_KEY = 'retro-idle:unload';

    const CARTRIDGE_TYPES = {
      0x00: 'ROM ONLY',
      0x01: 'MBC1',
      0x02: 'MBC1 + RAM',
      0x03: 'MBC1 + RAM + BATTERY',
      0x05: 'MBC2',
      0x06: 'MBC2 + BATTERY',
      0x0f: 'MBC3 + TIMER + BATTERY',
      0x10: 'MBC3 + TIMER + RAM + BATTERY',
      0x11: 'MBC3',
      0x12: 'MBC3 + RAM',
      0x13: 'MBC3 + RAM + BATTERY',
      0x19: 'MBC5',
      0x1a: 'MBC5 + RAM',
      0x1b: 'MBC5 + RAM + BATTERY',
      0x1c: 'MBC5 + RUMBLE',
      0x1d: 'MBC5 + RUMBLE + RAM',
      0x1e: 'MBC5 + RUMBLE + RAM + BATTERY',
    };

    const KEY_MAP = {
      ArrowUp: 'up',
      KeyW: 'up',
      ArrowDown: 'down',
      KeyS: 'down',
      ArrowLeft: 'left',
      KeyA: 'left',
      ArrowRight: 'right',
      KeyD: 'right',
      KeyX: 'a',
      KeyZ: 'b',
      Enter: 'start',
      ShiftLeft: 'select',
      ShiftRight: 'select',
      Tab: 'select',
    };

    const INPUT_TAGS = new Set(['INPUT', 'TEXTAREA', 'SELECT', 'OPTION', 'BUTTON']);
    const SUPPORTS_DOCUMENT_PIP = 'documentPictureInPicture' in window;
    const IS_MOBILE_OS =
      /iPad|iPhone|iPod|Android/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const screenSlotEl = document.getElementById('screen-slot');
    const canvas = document.getElementById('screen');
    const pipPlaceholderEl = document.getElementById('pip-placeholder');
    const pipReturnBtn = document.getElementById('pip-return-btn');
    const romInput = document.getElementById('rom-input');
    const togglePlayBtn = document.getElementById('toggle-play');
    const resetBtn = document.getElementById('reset-btn');
    const saveStateBtn = document.getElementById('save-state-btn');
    const loadStateBtn = document.getElementById('load-state-btn');
    const exportSavBtn = document.getElementById('export-sav-btn');
    const importSavBtn = document.getElementById('import-sav-btn');
    const savInput = document.getElementById('sav-input');
    const autoFightBtn = document.getElementById('auto-fight-btn');
    const touchPadBtn = document.getElementById('touch-pad-btn');
    const miniPlayerBtn = document.getElementById('mini-player-btn');
    const touchGamepadEl = document.getElementById('touch-gamepad');
    const touchDpadEl = document.getElementById('touch-dpad');
    const touchButtonElsByName = new Map();
    for (const el of touchGamepadEl.querySelectorAll('[data-gb-btn]')) {
      const btn = el.dataset.gbBtn;
      if (!touchButtonElsByName.has(btn)) touchButtonElsByName.set(btn, []);
      touchButtonElsByName.get(btn).push(el);
    }
    const touchDiscreteButtons = Array.from(touchGamepadEl.querySelectorAll('button[data-gb-btn]'));
    const autoFightStatusEl = document.getElementById('auto-fight-status');
    const healCenterStatusEl = document.getElementById('heal-center-status');
    const speedButtons = Array.from(document.querySelectorAll('.speed-btn'));
    const statusEl = document.getElementById('status');

    if (IS_MOBILE_OS) {
      romInput.removeAttribute('accept');
      savInput.removeAttribute('accept');
    }

    let binjgb;
    let audioCtx = null;
    let audioGain = null;
    let emu = null;
    let currentSpeed = 1;
    let currentRomBytes = null;
    let currentRomId = '';
    let currentRomTitle = '';
    let currentHeaderText = '';
    let hasManualSave = false;
    let isBusy = false;
    let sramFlushTimer = 0;
    let pipWindow = null;
    let pipUi = null;
    let isOpeningPip = false;
    let pipHiddenPauseTimer = 0;

    const autoFight = createAutoFight();
    let currentAutoFightProfile = null;
    let lastAutoFightText = '';
    let lastAutoFightIsError = false;
    let lastHealCenterText = '';
    let lastHealCenterLinked = false;
    const heldKeys = new Set();
    const activeTouchPointers = new Map();
    const heldTouchButtons = new Set();
    const mobileLayoutQuery = window.matchMedia('(pointer: coarse), (max-width: 768px)');
    let touchControlsOverride = null;
    let wakeLockSentinel = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator) || wakeLockSentinel || document.visibilityState !== 'visible') {
        return;
      }
      try {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', () => {
          wakeLockSentinel = null;
        });
      } catch {}
    }

    function releaseWakeLock() {
      const sentinel = wakeLockSentinel;
      wakeLockSentinel = null;
      if (sentinel) {
        sentinel.release().catch(() => {});
      }
    }

    function isMiniPlayerOpen() {
      return Boolean(pipWindow && !pipWindow.closed);
    }

    function getActiveAnimationWindow() {
      return isMiniPlayerOpen() ? pipWindow : window;
    }

    function getAudioContext() {
      if (!audioCtx) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (Ctor) {
          audioCtx = new Ctor();
          audioGain = audioCtx.createGain();
          audioGain.gain.value = currentSpeed === 1 ? 1 : 0;
          audioGain.connect(audioCtx.destination);
        }
      }
      return audioCtx;
    }

    function syncAudioGain() {
      if (audioCtx && audioGain) {
        audioGain.gain.setValueAtTime(currentSpeed === 1 ? 1 : 0, audioCtx.currentTime);
      }
    }

    function resumeAudioSafely() {
      const ctx = getAudioContext();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
    }

    function blurActiveElement() {
      for (const doc of [document, pipWindow?.document]) {
        const active = doc?.activeElement;
        if (active && active !== doc.body && typeof active.blur === 'function') {
          active.blur();
        }
      }
    }

    function bytesToBase64(bytes) {
      const chunks = [];
      for (let i = 0; i < bytes.length; i += 0x8000) {
        chunks.push(String.fromCharCode(...bytes.subarray(i, i + 0x8000)));
      }
      return btoa(chunks.join(''));
    }

    function base64ToBytes(b64) {
      return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    }

    const CRC_TABLE = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_TABLE[i] = c >>> 0;
    }
    function crc32Hex(bytes) {
      let crc = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
      return ((crc ^ 0xffffffff) >>> 0).toString(16).padStart(8, '0');
    }

    function parseRomHeader(bytes) {
      if (!bytes || bytes.length < 0x0150) return null;
      let title = '';
      for (let i = 0x0134; i <= 0x0142; i++) {
        const ch = bytes[i];
        if (ch === 0) break;
        if (ch >= 0x20 && ch <= 0x7e) title += String.fromCharCode(ch);
      }
      title = title.trim() || 'UNKNOWN';
      const typeCode = bytes[0x0147];
      const mbc = CARTRIDGE_TYPES[typeCode] || `TYPE 0x${typeCode.toString(16).padStart(2, '0').toUpperCase()}`;
      return { title, mbc, typeCode };
    }

    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(STORE_NAME)) {
            req.result.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function withDb(mode, fn, fallback = null) {
      let db;
      try {
        db = await openDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, mode);
          let result;
          const req = fn(tx.objectStore(STORE_NAME));
          if (req) req.onsuccess = () => { result = req.result; };
          tx.oncomplete = () => resolve(result ?? null);
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        });
      } catch (err) {
        console.warn('IndexedDB error:', err);
        return fallback;
      } finally {
        db?.close();
      }
    }

    const dbGet = (key) => withDb('readonly', (s) => s.get(key));
    const dbPut = (key, value) => withDb('readwrite', (s) => s.put(value, key));
    const dbDelete = (key) => withDb('readwrite', (s) => s.delete(key));

    class BinjgbEmulator {
      constructor(
        module,
        romBytes,
        extRamBytes,
        canvasEl,
        { onExtRamUpdated, onFrame, speed = 1, animationWindow = window } = {}
      ) {
        this.module = module;
        this.onExtRamUpdated = onExtRamUpdated;
        this.onFrame = onFrame;
        const parsedSpeed = Number(speed);
        this.speed = Number.isFinite(parsedSpeed) && parsedSpeed > 0 ? parsedSpeed : 1;
        this.rafWindow = animationWindow && !animationWindow.closed ? animationWindow : window;
        this.overrideButtons = null;
        this.ctx = canvasEl.getContext('2d');
        this.imageData = this.ctx.createImageData(SCREEN_WIDTH, SCREEN_HEIGHT);

        const alignedSize = (romBytes.byteLength + 0x7fff) & ~0x7fff;
        this.romPtr = module._malloc(alignedSize);
        new Uint8Array(module.HEAP8.buffer, this.romPtr, alignedSize).fill(0);
        new Uint8Array(module.HEAP8.buffer, this.romPtr, alignedSize).set(romBytes);

        const sampleRate = getAudioContext()?.sampleRate || 44100;
        this.e = module._emulator_new_simple(this.romPtr, alignedSize, sampleRate, AUDIO_FRAMES, 2);
        if (this.e === 0) {
          module._free(this.romPtr);
          this.romPtr = 0;
          throw new Error('Invalid ROM');
        }

        this.joypadPtr = module._joypad_new();
        module._emulator_set_default_joypad_callback(this.e, this.joypadPtr);

        this.sramSize = this.withFileData(module._ext_ram_file_data_new(this.e), (_, buf) => buf.byteLength);
        if (extRamBytes && this.sramSize > 0) {
          this.loadExtRam(extRamBytes);
        }

        this.rafId = 0;
        this.lastSec = 0;
        this.leftoverTicks = 0;
        this.audioStartSec = 0;
        this.destroyed = false;
        this.lastButtons = {};
        for (const [k, fn] of Object.entries(this.getJoypadSetters())) {
          this.lastButtons[k] = false;
          fn(this.e, 0);
        }
      }

      getJoypadSetters() {
        return {
          up: this.module._set_joyp_up,
          down: this.module._set_joyp_down,
          left: this.module._set_joyp_left,
          right: this.module._set_joyp_right,
          a: this.module._set_joyp_A,
          b: this.module._set_joyp_B,
          start: this.module._set_joyp_start,
          select: this.module._set_joyp_select,
        };
      }

      get isPaused() {
        return this.rafId === 0;
      }

      get isPlaying() {
        return !this.destroyed && this.rafId !== 0;
      }

      withFileData(fileDataPtr, fn) {
        const ptr = this.module._get_file_data_ptr(fileDataPtr);
        const size = this.module._get_file_data_size(fileDataPtr);
        try {
          return fn(fileDataPtr, new Uint8Array(this.module.HEAP8.buffer, ptr, size));
        } finally {
          this.module._file_data_delete(fileDataPtr);
          this.module._free(fileDataPtr);
        }
      }

      getSaveState() {
        return this.withFileData(this.module._state_file_data_new(this.e), (ptr, buf) => {
          this.module._emulator_write_state(this.e, ptr);
          return new Uint8Array(buf);
        });
      }

      loadState(stateBytes) {
        return this.withFileData(this.module._state_file_data_new(this.e), (ptr, buf) => {
          if (!stateBytes || buf.byteLength !== stateBytes.byteLength) return false;
          buf.set(stateBytes);
          this.module._emulator_read_state(this.e, ptr);
          this.leftoverTicks = 0;
          this.audioStartSec = 0;
          return true;
        });
      }

      getTicks() {
        return this.destroyed || !this.e ? 0 : this.module._emulator_get_ticks_f64(this.e);
      }

      setSpeed(speed) {
        const next = Number(speed);
        if (!Number.isFinite(next) || next <= 0 || next === this.speed) return;
        this.speed = next;
        this.leftoverTicks = 0;
        this.audioStartSec = 0;
      }

      setAnimationWindow(win) {
        const nextWin = win && !win.closed ? win : window;
        if (nextWin === this.rafWindow) return;
        const wasPlaying = this.rafId !== 0;
        if (wasPlaying) {
          if (!this.rafWindow.closed) {
            this.rafWindow.cancelAnimationFrame(this.rafId);
          }
          this.rafId = 0;
        }
        this.rafWindow = nextWin;
        this.lastSec = 0;
        if (wasPlaying && !this.destroyed) {
          this.rafId = this.rafWindow.requestAnimationFrame(this.stepFrame);
        }
      }

      getExtRam() {
        if (this.sramSize === 0) return new Uint8Array();
        return this.withFileData(this.module._ext_ram_file_data_new(this.e), (ptr, buf) => {
          this.module._emulator_write_ext_ram(this.e, ptr);
          return new Uint8Array(buf);
        });
      }

      loadExtRam(ramBytes) {
        if (this.sramSize === 0 || !ramBytes) return;
        this.withFileData(this.module._ext_ram_file_data_new(this.e), (ptr, buf) => {
          buf.fill(0);
          buf.set(ramBytes.subarray(0, buf.byteLength));
          this.module._emulator_read_ext_ram(this.e, ptr);
        });
      }

      readMem(addr) {
        return this.module._emulator_read_mem(this.e, addr) & 0xff;
      }

      setOverrideButtons(btns) {
        this.overrideButtons = btns;
        this.syncInput();
      }

      syncInput() {
        let next;
        if (this.overrideButtons) {
          next = { ...this.overrideButtons };
        } else {
          next = {
            up: heldKeys.has('up') || heldTouchButtons.has('up'),
            down: heldKeys.has('down') || heldTouchButtons.has('down'),
            left: heldKeys.has('left') || heldTouchButtons.has('left'),
            right: heldKeys.has('right') || heldTouchButtons.has('right'),
            a: heldKeys.has('a') || heldTouchButtons.has('a'),
            b: heldKeys.has('b') || heldTouchButtons.has('b'),
            start: heldKeys.has('start') || heldTouchButtons.has('start'),
            select: heldKeys.has('select') || heldTouchButtons.has('select'),
          };

          const pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (const pad of pads) {
            if (!pad || !pad.connected) continue;
            const b = pad.buttons || [];
            const ax = pad.axes || [];
            const pressed = (idx) => Boolean(b[idx] && (b[idx].pressed || b[idx].value > 0.5));
            next.a ||= pressed(0);
            next.b ||= pressed(1);
            next.select ||= pressed(8);
            next.start ||= pressed(9);
            next.up ||= pressed(12) || (ax[1] ?? 0) < -0.5;
            next.down ||= pressed(13) || (ax[1] ?? 0) > 0.5;
            next.left ||= pressed(14) || (ax[0] ?? 0) < -0.5;
            next.right ||= pressed(15) || (ax[0] ?? 0) > 0.5;
            break;
          }
        }

        const setters = this.getJoypadSetters();
        for (const k of Object.keys(next)) {
          if (next[k] !== this.lastButtons[k]) {
            this.lastButtons[k] = next[k];
            setters[k](this.e, next[k] ? 1 : 0);
          }
        }
      }

      pushAudio() {
        if (this.speed !== 1) return;
        const ctx = getAudioContext();
        if (!ctx || ctx.state !== 'running') return;
        const ptr = this.module._get_audio_buffer_ptr(this.e);
        const cap = this.module._get_audio_buffer_capacity(this.e);
        const samples = new Uint8Array(this.module.HEAP8.buffer, ptr, cap);
        const nowSec = ctx.currentTime;
        const nowPlusLatency = nowSec + AUDIO_LATENCY_SEC;
        this.audioStartSec = this.audioStartSec || nowPlusLatency;
        if (this.audioStartSec >= nowSec) {
          const buffer = ctx.createBuffer(2, AUDIO_FRAMES, ctx.sampleRate);
          const ch0 = buffer.getChannelData(0);
          const ch1 = buffer.getChannelData(1);
          for (let i = 0; i < AUDIO_FRAMES; i++) {
            ch0[i] = (samples[2 * i] * 0.5) / 255;
            ch1[i] = (samples[2 * i + 1] * 0.5) / 255;
          }
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          src.connect(audioGain || ctx.destination);
          src.start(this.audioStartSec);
          this.audioStartSec += AUDIO_FRAMES / ctx.sampleRate;
        } else {
          this.audioStartSec = nowPlusLatency;
        }
      }

      captureFrame() {
        const ptr = this.module._get_frame_buffer_ptr(this.e);
        const size = this.module._get_frame_buffer_size(this.e);
        const fb = new Uint8Array(this.module.HEAP8.buffer, ptr, size);
        this.imageData.data.set(fb);
      }

      presentFrame() {
        this.ctx.putImageData(this.imageData, 0, 0);
      }

      renderFrame() {
        this.captureFrame();
        this.presentFrame();
      }

      stepFrame = (ms) => {
        if (this.destroyed || this.rafId === 0) return;
        if (this.rafWindow !== window && this.rafWindow.closed) {
          this.rafWindow = window;
          this.lastSec = 0;
        }
        this.rafId = this.rafWindow.requestAnimationFrame(this.stepFrame);
        this.syncInput();

        const sec = ms / 1000;
        const deltaSec = Math.max(sec - (this.lastSec || sec), 0);
        this.lastSec = sec;

        const startTicks = this.module._emulator_get_ticks_f64(this.e);
        const deltaTicks = Math.min(deltaSec, MAX_UPDATE_SEC) * CPU_TICKS_PER_SECOND * this.speed;
        const untilTicks = startTicks + deltaTicks - this.leftoverTicks;
        const deadlineMs = this.speed > 1 ? performance.now() + MAX_TURBO_STEP_MS : Infinity;
        let hasNewFrame = false;
        let budgetExceeded = false;

        while (true) {
          const ev = this.module._emulator_run_until_f64(this.e, untilTicks);
          if (ev & EVENT_NEW_FRAME) {
            this.captureFrame();
            hasNewFrame = true;
            this.onFrame?.();
            if (this.destroyed || this.rafId === 0) break;
          }
          if (ev & EVENT_AUDIO_BUFFER_FULL) this.pushAudio();
          if ((ev & EVENT_UNTIL_TICKS) || ev === 0) break;
          if (performance.now() >= deadlineMs) {
            budgetExceeded = true;
            break;
          }
        }
        if (this.destroyed) return;
        if (hasNewFrame) this.presentFrame();
        this.leftoverTicks =
          budgetExceeded || this.rafId === 0
            ? 0
            : (this.module._emulator_get_ticks_f64(this.e) - untilTicks) | 0;

        if (this.module._emulator_was_ext_ram_updated(this.e)) {
          this.onExtRamUpdated?.();
        }
      };

      resume() {
        if (this.destroyed || this.rafId !== 0) return;
        if (this.rafWindow !== window && this.rafWindow.closed) {
          this.rafWindow = window;
        }
        this.lastSec = 0;
        this.audioStartSec = 0;
        resumeAudioSafely();
        requestWakeLock();
        this.rafId = this.rafWindow.requestAnimationFrame(this.stepFrame);
      }

      pause() {
        if (this.rafId !== 0) {
          if (!this.rafWindow.closed) {
            this.rafWindow.cancelAnimationFrame(this.rafId);
          }
          this.rafId = 0;
        }
        if (this.rafWindow !== window && this.rafWindow.closed) {
          this.rafWindow = window;
          this.lastSec = 0;
        }
        this.audioStartSec = 0;
        if (audioCtx && audioCtx.state === 'running') {
          audioCtx.suspend().catch(() => {});
        }
        releaseWakeLock();
      }

      destroy() {
        if (this.destroyed) return;
        this.pause();
        this.destroyed = true;
        if (this.e) {
          this.module._emulator_delete(this.e);
          this.e = 0;
        }
        if (this.joypadPtr) {
          this.module._joypad_delete(this.joypadPtr);
          this.joypadPtr = 0;
        }
        if (this.romPtr) {
          this.module._free(this.romPtr);
          this.romPtr = 0;
        }
      }
    }

    function setAutoFightStatus(text, { isError = false } = {}) {
      if (text === lastAutoFightText && isError === lastAutoFightIsError) return;
      lastAutoFightText = text;
      lastAutoFightIsError = isError;
      autoFightStatusEl.textContent = text;
      autoFightStatusEl.hidden = !text;
      autoFightStatusEl.classList.toggle('error', Boolean(text) && isError);
      syncMiniPlayerUi();
    }

    function syncHealCenterStatus() {
      const supported = Boolean(emu && currentAutoFightProfile);
      if (!supported) {
        if (lastHealCenterText !== '' || lastHealCenterLinked !== false || !healCenterStatusEl.hidden) {
          lastHealCenterText = '';
          lastHealCenterLinked = false;
          healCenterStatusEl.textContent = '';
          healCenterStatusEl.classList.remove('linked');
          healCenterStatusEl.hidden = true;
          syncMiniPlayerUi();
        }
        return;
      }

      const st = autoFight.getState();
      let text;
      let linked = false;
      if (st.inPokeCenter && st.pokeCenterName) {
        text = `Heal Center visited: ${st.pokeCenterName} — exit to record return path`;
        linked = true;
      } else if (st.pokeCenterName && st.trailLength > 0) {
        const stepsLabel = st.trailLength === 1 ? 'step' : 'steps';
        text = `Heal Center path active: ${st.pokeCenterName} (${st.trailLength} ${stepsLabel})`;
        linked = true;
      } else {
        text = 'Heal Center: not visited yet — visit one to enable auto-heal return';
      }

      if (text !== lastHealCenterText || linked !== lastHealCenterLinked || healCenterStatusEl.hidden) {
        lastHealCenterText = text;
        lastHealCenterLinked = linked;
        healCenterStatusEl.textContent = text;
        healCenterStatusEl.classList.toggle('linked', linked);
        healCenterStatusEl.hidden = false;
        syncMiniPlayerUi();
      }
    }

    function setSpeed(speed) {
      const next = Number(speed);
      if (!SPEED_OPTIONS.includes(next)) return;
      currentSpeed = next;
      emu?.setSpeed(currentSpeed);
      syncAudioGain();
      for (const btn of speedButtons) {
        const active = Number(btn.dataset.speed) === currentSpeed;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      }
      syncMiniPlayerUi();
    }

    function syncMiniPlayerButton() {
      miniPlayerBtn.hidden = !SUPPORTS_DOCUMENT_PIP;
      if (!SUPPORTS_DOCUMENT_PIP) {
        miniPlayerBtn.disabled = true;
        miniPlayerBtn.textContent = 'Mini-Player';
        miniPlayerBtn.classList.remove('active');
        miniPlayerBtn.title = 'Document Picture-in-Picture requires Chrome or Edge desktop';
        return;
      }
      const open = isMiniPlayerOpen();
      miniPlayerBtn.disabled = !open && (!emu || isBusy || isOpeningPip);
      miniPlayerBtn.textContent = open ? 'Exit Mini-Player' : 'Mini-Player';
      miniPlayerBtn.classList.toggle('active', open);
      miniPlayerBtn.title = 'Pop out always-on-top mini-player (Chrome / Edge desktop)';
    }

    function syncMiniPlayerUi() {
      if (!pipUi || !isMiniPlayerOpen()) return;
      pipWindow.document.title = currentRomTitle
        ? `${currentRomTitle} — retro-idle`
        : 'retro-idle — Mini-Player';

      const loaded = Boolean(emu);
      const playing = Boolean(emu?.isPlaying);
      pipUi.togglePlayBtn.disabled = !loaded || isBusy;
      pipUi.togglePlayBtn.textContent = playing ? 'Pause' : 'Resume';

      const pokemonSupported = loaded && Boolean(currentAutoFightProfile);
      const autoActive = autoFight.getState().active;
      pipUi.autoFightBtn.hidden = !pokemonSupported;
      pipUi.autoFightBtn.disabled = !pokemonSupported || isBusy;
      pipUi.autoFightBtn.textContent = autoActive ? 'Stop' : 'Auto-Fight';
      pipUi.autoFightBtn.classList.toggle('active', autoActive);

      pipUi.speedBtn.textContent = `${currentSpeed}x`;
      pipUi.speedBtn.classList.toggle('active', currentSpeed > 1);

      if (lastAutoFightText) {
        pipUi.statusPrimaryEl.textContent = lastAutoFightText;
        pipUi.statusPrimaryEl.classList.toggle('error', lastAutoFightIsError);
        pipUi.statusPrimaryEl.classList.toggle('accent', !lastAutoFightIsError);
      } else {
        pipUi.statusPrimaryEl.textContent = `${playing ? '' : 'Paused · '}${currentRomTitle || 'No ROM'}`;
        pipUi.statusPrimaryEl.classList.remove('error', 'accent');
      }

      if (pokemonSupported && lastHealCenterText) {
        pipUi.statusHealEl.textContent = lastHealCenterText;
        pipUi.statusHealEl.classList.toggle('linked', lastHealCenterLinked);
        pipUi.statusHealEl.hidden = false;
      } else {
        pipUi.statusHealEl.textContent = '';
        pipUi.statusHealEl.classList.remove('linked');
        pipUi.statusHealEl.hidden = true;
      }
    }

    function syncAutoFightButton() {
      const supported = Boolean(emu && currentAutoFightProfile);
      const active = autoFight.getState().active;
      autoFightBtn.disabled = !supported || isBusy;
      autoFightBtn.textContent = active ? 'Stop Auto-Fight' : 'Auto-Fight';
      autoFightBtn.classList.toggle('active', active);
      syncHealCenterStatus();
      syncMiniPlayerUi();
    }

    function stopAutoFight(reason = null) {
      autoFight.stop(reason || 'manual');
      emu?.setOverrideButtons(null);
      syncAutoFightButton();
      const showReason = Boolean(reason && reason !== 'manual');
      setAutoFightStatus(showReason ? `Auto-Fight stopped: ${reason}` : '', { isError: showReason });
    }

    function formatAutoFightPhase(res, state) {
      switch (res.phase) {
        case 'returning':
          return 'Auto-Fight: returning to Heal Center...';
        case 'fleeing':
          return 'Auto-Fight: fleeing battle...';
        case 'healing':
          return 'Auto-Fight: healing at Heal Center...';
        case 'walking_back':
          return 'Auto-Fight: walking back to grind spot...';
        default:
          return `Auto-Fight: ${res.phase}...${state.hasHealPath ? ' (Heal Center path ready)' : ''}`;
      }
    }

    function stepAutoFight() {
      if (!emu || !currentAutoFightProfile || !autoFight.getState().active) return;
      const snap = currentAutoFightProfile.readSnapshot((a) => emu.readMem(a));
      const res = autoFight.step(snap);
      if (!res.active) {
        stopAutoFight(res.stopReason);
        return;
      }
      emu.setOverrideButtons(res.buttons);
      setAutoFightStatus(formatAutoFightPhase(res, autoFight.getState()));
    }

    function onEmulatorFrame() {
      if (!emu || !currentAutoFightProfile) return;
      if (autoFight.getState().active) {
        stepAutoFight();
      } else {
        autoFight.observe(currentAutoFightProfile.readOverworldPos((a) => emu.readMem(a)));
      }
      syncHealCenterStatus();
    }

    function startAutoFight() {
      if (!emu || isBusy || !currentAutoFightProfile) return;
      if (emu.isPaused) {
        emu.resume();
        syncControls();
      }
      const snap = currentAutoFightProfile.readSnapshot((a) => emu.readMem(a));
      autoFight.start(snap);
      syncAutoFightButton();
      stepAutoFight();
      blurActiveElement();
    }

    function setActionButtonsDisabled() {
      const loaded = Boolean(emu);
      togglePlayBtn.disabled = !loaded || isBusy;
      resetBtn.disabled = !loaded || isBusy;
      saveStateBtn.disabled = !loaded || isBusy;
      loadStateBtn.disabled = !loaded || !hasManualSave || isBusy;
      const canUseSav = loaded && emu.sramSize > 0 && !isBusy;
      exportSavBtn.disabled = !canUseSav;
      importSavBtn.disabled = !canUseSav;
      syncAutoFightButton();
      syncMiniPlayerButton();
      syncMiniPlayerUi();
    }

    function syncControls(statusSuffix = '') {
      setActionButtonsDisabled();
      if (!emu) {
        togglePlayBtn.textContent = 'Pause';
        syncMiniPlayerUi();
        return;
      }
      const playing = emu.isPlaying;
      togglePlayBtn.textContent = playing ? 'Pause' : 'Resume';
      statusEl.textContent = `${playing ? 'Playing' : 'Paused'}: ${currentHeaderText}${statusSuffix}`;
      syncMiniPlayerUi();
    }

    const PIP_STYLES = `
      :root {
        color-scheme: dark;
        --bg: #0b1120;
        --panel: #111827;
        --border: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      [hidden] {
        display: none;
      }
      .pip-root {
        width: 100%;
        height: 100%;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: var(--panel);
      }
      .pip-stage {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: grid;
        place-items: center;
        container-type: size;
      }
      .pip-stage #screen {
        width: min(100cqw, calc(100cqh * 160 / 144));
        height: min(100cqh, calc(100cqw * 144 / 160));
        aspect-ratio: 160 / 144;
        image-rendering: pixelated;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 4px;
        display: block;
      }
      .pip-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: center;
        flex-shrink: 0;
      }
      .pip-controls button {
        font: inherit;
        font-size: 0.75rem;
        line-height: 1.2;
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #1e293b;
        color: var(--text);
        cursor: pointer;
      }
      .pip-controls button:not(:disabled):hover {
        border-color: var(--accent);
      }
      .pip-controls button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .pip-controls button.active {
        border-color: var(--accent);
        background: #0c4a6e;
      }
      .pip-status {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: center;
        flex-shrink: 0;
        font-size: 0.72rem;
        line-height: 1.25;
        color: var(--muted);
      }
      .pip-status-primary,
      .pip-status-heal {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pip-status-primary.accent {
        color: var(--accent);
      }
      .pip-status-primary.error {
        color: #f87171;
      }
      .pip-status-heal.linked {
        color: #34d399;
      }
    `;

    function togglePlayPause() {
      return runTransportAction(async () => {
        if (emu.isPlaying) {
          stopAutoFight();
          emu.pause();
          await flushEmulatorPersistence();
        } else {
          emu.resume();
        }
      });
    }

    function toggleAutoFight() {
      if (!emu || isBusy || !currentAutoFightProfile) return;
      resumeAudioSafely();
      if (autoFight.getState().active) {
        stopAutoFight('manual');
      } else {
        startAutoFight();
      }
      blurActiveElement();
    }

    function cycleSpeed() {
      resumeAudioSafely();
      const idx = SPEED_OPTIONS.indexOf(currentSpeed);
      const next = SPEED_OPTIONS[(idx + 1) % SPEED_OPTIONS.length];
      setSpeed(next);
      blurActiveElement();
    }

    function handleMiniPlayerPageHide() {
      teardownMiniPlayer();
    }

    function teardownMiniPlayer({ closeWindow = false, focusMain = false } = {}) {
      if (!pipWindow) return;
      clearTimeout(pipHiddenPauseTimer);
      pipHiddenPauseTimer = 0;

      const win = pipWindow;
      pipWindow = null;
      pipUi = null;
      heldKeys.clear();

      win.removeEventListener('keydown', handleKeyDown);
      win.removeEventListener('keyup', handleKeyUp);
      win.removeEventListener('blur', handleWindowBlur);
      win.removeEventListener('pointerdown', resumeAudioSafely);
      win.removeEventListener('pagehide', handleMiniPlayerPageHide);

      screenSlotEl.insertBefore(canvas, pipPlaceholderEl);
      pipPlaceholderEl.hidden = true;
      emu?.setAnimationWindow(window);
      emu?.presentFrame();
      syncMiniPlayerButton();

      if (focusMain) {
        window.focus();
      }
      if (closeWindow && !win.closed) {
        try {
          win.close();
        } catch {}
      }
      if (document.visibilityState === 'hidden') {
        writeUnloadSnapshot();
        pipHiddenPauseTimer = setTimeout(() => {
          pipHiddenPauseTimer = 0;
          if (!isMiniPlayerOpen() && document.visibilityState === 'hidden') {
            handleDocumentHidden();
          }
        }, 150);
      }
    }

    async function openMiniPlayer() {
      if (!SUPPORTS_DOCUMENT_PIP || !emu || isBusy || isOpeningPip || isMiniPlayerOpen()) return;
      isOpeningPip = true;
      syncMiniPlayerButton();
      try {
        const win = await window.documentPictureInPicture.requestWindow({ width: 340, height: 376 });
        if (!emu || win.closed) {
          if (!win.closed) {
            try {
              win.close();
            } catch {}
          }
          return;
        }

        const doc = win.document;
        const styleEl = doc.createElement('style');
        styleEl.textContent = PIP_STYLES;
        doc.head.appendChild(styleEl);

        const root = doc.createElement('div');
        root.className = 'pip-root';

        const stage = doc.createElement('div');
        stage.className = 'pip-stage';
        stage.appendChild(canvas);

        const controls = doc.createElement('div');
        controls.className = 'pip-controls';

        const makePipButton = (action, label, onClick) => {
          const btn = doc.createElement('button');
          btn.type = 'button';
          btn.dataset.pipAction = action;
          btn.textContent = label;
          btn.addEventListener('click', onClick);
          return btn;
        };

        const pipTogglePlayBtn = makePipButton('toggle-play', 'Pause', togglePlayPause);
        const pipAutoFightBtn = makePipButton('auto-fight', 'Auto-Fight', toggleAutoFight);
        const pipSpeedBtn = makePipButton('speed', `${currentSpeed}x`, cycleSpeed);
        const pipReturnActionBtn = makePipButton('return', 'Return to Tab', () => {
          resumeAudioSafely();
          teardownMiniPlayer({ closeWindow: true, focusMain: true });
        });

        controls.append(pipTogglePlayBtn, pipAutoFightBtn, pipSpeedBtn, pipReturnActionBtn);

        const statusBox = doc.createElement('div');
        statusBox.className = 'pip-status';
        const statusPrimaryEl = doc.createElement('div');
        statusPrimaryEl.className = 'pip-status-primary';
        const statusHealEl = doc.createElement('div');
        statusHealEl.className = 'pip-status-heal';
        statusHealEl.hidden = true;
        statusBox.append(statusPrimaryEl, statusHealEl);

        root.append(stage, controls, statusBox);
        doc.body.replaceChildren(root);

        pipPlaceholderEl.hidden = false;

        win.addEventListener('keydown', handleKeyDown);
        win.addEventListener('keyup', handleKeyUp);
        win.addEventListener('blur', handleWindowBlur);
        win.addEventListener('pointerdown', resumeAudioSafely, { passive: true });
        win.addEventListener('pagehide', handleMiniPlayerPageHide);

        pipWindow = win;
        pipUi = {
          togglePlayBtn: pipTogglePlayBtn,
          autoFightBtn: pipAutoFightBtn,
          speedBtn: pipSpeedBtn,
          returnBtn: pipReturnActionBtn,
          statusPrimaryEl,
          statusHealEl,
        };

        emu.setAnimationWindow(win);
        emu.presentFrame();
        syncMiniPlayerUi();
        blurActiveElement();
      } catch (err) {
        console.warn('Could not open Mini-Player:', err);
      } finally {
        isOpeningPip = false;
        syncMiniPlayerButton();
      }
    }

    function scheduleSramFlush() {
      if (!emu || !currentRomId || emu.sramSize === 0) return;
      clearTimeout(sramFlushTimer);
      sramFlushTimer = setTimeout(() => {
        if (emu && currentRomId && emu.sramSize > 0) {
          dbPut(`sram:${currentRomId}`, emu.getExtRam());
        }
      }, 500);
    }

    async function flushEmulatorPersistence() {
      if (!emu || !currentRomId) return;
      clearTimeout(sramFlushTimer);
      const writes = [dbPut(`autoState:${currentRomId}`, emu.getSaveState())];
      if (emu.sramSize > 0) {
        writes.push(dbPut(`sram:${currentRomId}`, emu.getExtRam()));
      }
      if (currentAutoFightProfile) {
        const trail = autoFight.exportTrail();
        writes.push(
          trail ? dbPut(`pokeTrail:${currentRomId}`, trail) : dbDelete(`pokeTrail:${currentRomId}`)
        );
      }
      await Promise.all(writes);
    }

    function writeUnloadSnapshot() {
      if (!emu || !currentRomId) return;
      try {
        const sram = emu.sramSize > 0 ? emu.getExtRam() : new Uint8Array();
        const pokeTrail = currentAutoFightProfile ? autoFight.exportTrail() : null;
        localStorage.setItem(
          UNLOAD_KEY,
          JSON.stringify({
            romId: currentRomId,
            state: bytesToBase64(emu.getSaveState()),
            sram: sram.length ? bytesToBase64(sram) : '',
            pokeTrail,
          })
        );
      } catch (err) {
        console.warn('Could not write unload snapshot:', err);
      }
    }

    function clearPendingUnloadFor(romId) {
      try {
        const raw = localStorage.getItem(UNLOAD_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed?.romId === romId) {
          localStorage.removeItem(UNLOAD_KEY);
        }
      } catch {
        localStorage.removeItem(UNLOAD_KEY);
      }
    }

    async function consumePendingUnload() {
      try {
        const raw = localStorage.getItem(UNLOAD_KEY);
        if (!raw) return;
        localStorage.removeItem(UNLOAD_KEY);
        const parsed = JSON.parse(raw);
        if (!parsed?.romId || !parsed?.state) return;
        await dbPut(`autoState:${parsed.romId}`, base64ToBytes(parsed.state));
        if (parsed.sram) {
          await dbPut(`sram:${parsed.romId}`, base64ToBytes(parsed.sram));
        }
        if (parsed.pokeTrail) {
          await dbPut(`pokeTrail:${parsed.romId}`, parsed.pokeTrail);
        } else if ('pokeTrail' in parsed) {
          await dbDelete(`pokeTrail:${parsed.romId}`);
        }
      } catch (err) {
        console.warn('Could not restore pending unload snapshot:', err);
      }
    }

    async function loadRom(romSource, fileName, { persist = false } = {}) {
      if (!romSource || isBusy) return;
      const label = fileName || (romSource instanceof File ? romSource.name : 'ROM');
      let loadStatusSuffix = '';
      isBusy = true;
      setActionButtonsDisabled();
      statusEl.textContent = `Loading ${label}...`;

      try {
        resumeAudioSafely();
        if (String(label).toLowerCase().endsWith('.zip')) {
          throw new Error('Please unzip the .gb / .gbc file first');
        }

        let romBytes;
        if (romSource instanceof Uint8Array) {
          romBytes = romSource;
        } else if (romSource instanceof Blob) {
          romBytes = new Uint8Array(await romSource.arrayBuffer());
        } else {
          const res = await fetch(romSource);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          romBytes = new Uint8Array(await res.arrayBuffer());
        }

        stopAutoFight();
        clearTouchInput();
        await flushEmulatorPersistence();
        autoFight.clearTrail();
        await consumePendingUnload();

        if (emu) {
          emu.destroy();
          emu = null;
        }
        currentAutoFightProfile = null;

        const header = parseRomHeader(romBytes);
        currentRomBytes = romBytes;
        currentRomId = crc32Hex(romBytes);
        currentRomTitle = header ? header.title : label;
        currentHeaderText = header ? `${header.title} (${header.mbc})` : label;
        currentAutoFightProfile = getAutoFightProfile(currentRomTitle);

        const [sram, autoState, manualState, savedTrail] = await Promise.all([
          dbGet(`sram:${currentRomId}`),
          dbGet(`autoState:${currentRomId}`),
          dbGet(`manualState:${currentRomId}`),
          dbGet(`pokeTrail:${currentRomId}`),
        ]);
        hasManualSave = Boolean(manualState);

        emu = new BinjgbEmulator(binjgb, romBytes, sram, canvas, {
          onExtRamUpdated: scheduleSramFlush,
          onFrame: onEmulatorFrame,
          speed: currentSpeed,
          animationWindow: getActiveAnimationWindow(),
        });

        if (autoState && emu.loadState(autoState)) {
          loadStatusSuffix = ' — resumed auto-save';
          if (currentAutoFightProfile && savedTrail) {
            autoFight.importTrail(savedTrail);
          }
        }
        emu.resume();

        if (persist) {
          await dbPut(LAST_ROM_KEY, { bytes: romBytes, name: label, savedAt: Date.now() });
        }
      } catch (err) {
        if (!emu) currentAutoFightProfile = null;
        console.error(err);
        statusEl.textContent = `Failed to load ROM: ${err?.message || err}`;
      } finally {
        isBusy = false;
        if (!emu && isMiniPlayerOpen()) {
          teardownMiniPlayer({ closeWindow: true });
        }
        if (emu && !statusEl.textContent.startsWith('Failed')) {
          syncControls(loadStatusSuffix);
        } else {
          setActionButtonsDisabled();
        }
        blurActiveElement();
      }
    }

    async function runTransportAction(action) {
      if (isBusy || !emu) return;
      isBusy = true;
      setActionButtonsDisabled();
      let statusSuffix = '';
      let hadError = false;
      try {
        resumeAudioSafely();
        statusSuffix = (await action()) || '';
      } catch (err) {
        hadError = true;
        console.error(err);
        statusEl.textContent = `Action failed: ${err?.message || err}`;
      } finally {
        isBusy = false;
        if (hadError) {
          setActionButtonsDisabled();
        } else {
          syncControls(statusSuffix);
        }
        blurActiveElement();
      }
    }

    romInput.addEventListener('change', async () => {
      const file = romInput.files?.[0];
      romInput.value = '';
      if (file) {
        await loadRom(file, file.name, { persist: true });
      } else {
        blurActiveElement();
      }
    });

    togglePlayBtn.addEventListener('click', togglePlayPause);

    async function rebootWithSram(sramBytes) {
      stopAutoFight();
      clearTouchInput();
      autoFight.clearTrail();
      clearTimeout(sramFlushTimer);
      if (sramBytes) await dbPut(`sram:${currentRomId}`, sramBytes);
      await dbDelete(`autoState:${currentRomId}`);
      await dbDelete(`pokeTrail:${currentRomId}`);
      clearPendingUnloadFor(currentRomId);
      emu.destroy();
      emu = new BinjgbEmulator(binjgb, currentRomBytes, sramBytes, canvas, {
        onExtRamUpdated: scheduleSramFlush,
        onFrame: onEmulatorFrame,
        speed: currentSpeed,
        animationWindow: getActiveAnimationWindow(),
      });
      emu.resume();
    }

    resetBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        const sram = emu.sramSize > 0 ? emu.getExtRam() : null;
        await rebootWithSram(sram);
      })
    );

    saveStateBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        await dbPut(`manualState:${currentRomId}`, emu.getSaveState());
        hasManualSave = true;
        return ' — state saved';
      })
    );

    loadStateBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        stopAutoFight();
        autoFight.clearTrail();
        const state = await dbGet(`manualState:${currentRomId}`);
        if (!state || !emu.loadState(state)) {
          hasManualSave = false;
          throw new Error('No compatible manual save state found');
        }
        emu.resume();
        return ' — state loaded';
      })
    );

    for (const btn of speedButtons) {
      btn.addEventListener('click', () => {
        resumeAudioSafely();
        setSpeed(Number(btn.dataset.speed));
        blurActiveElement();
      });
    }

    autoFightBtn.addEventListener('click', toggleAutoFight);

    miniPlayerBtn.addEventListener('click', () => {
      resumeAudioSafely();
      if (isMiniPlayerOpen()) {
        teardownMiniPlayer({ closeWindow: true });
      } else {
        openMiniPlayer();
      }
      blurActiveElement();
    });

    pipReturnBtn.addEventListener('click', () => {
      resumeAudioSafely();
      teardownMiniPlayer({ closeWindow: true, focusMain: true });
      blurActiveElement();
    });

    exportSavBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        if (emu.sramSize <= 0) {
          throw new Error('Cartridge has no battery RAM');
        }
        const ramBytes = emu.getExtRam();
        const safeTitle = (currentRomTitle || 'save').replace(/[^a-zA-Z0-9._-]+/g, '_');
        const url = URL.createObjectURL(new Blob([ramBytes], { type: 'application/octet-stream' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `${safeTitle}.sav`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return ' — exported .sav';
      })
    );

    importSavBtn.addEventListener('click', () => {
      if (isBusy || !emu || emu.sramSize <= 0) return;
      blurActiveElement();
      savInput.click();
    });

    savInput.addEventListener('change', async () => {
      const file = savInput.files?.[0];
      savInput.value = '';
      if (!file) {
        blurActiveElement();
        return;
      }
      await runTransportAction(async () => {
        if (emu.sramSize <= 0) {
          throw new Error('Cartridge has no battery RAM');
        }
        const raw = new Uint8Array(await file.arrayBuffer());
        if (raw.length === 0 || raw.length > 0x40000) {
          throw new Error('Invalid .sav file size');
        }
        const normalized = new Uint8Array(emu.sramSize);
        normalized.set(raw.subarray(0, emu.sramSize));
        await rebootWithSram(normalized);
        return ' — imported .sav';
      });
    });

    function isInteractiveElementFocused(e) {
      const activeDoc = e.view?.document || e.currentTarget?.document || document;
      const active = activeDoc?.activeElement;
      return Boolean(active && INPUT_TAGS.has(active.tagName));
    }

    function handleKeyDown(e) {
      resumeAudioSafely();
      if (e.code === 'Escape' && autoFight.getState().active) {
        stopAutoFight('manual');
        e.preventDefault();
        return;
      }
      const speedChoice = SPEED_KEY_MAP[e.code];
      if (
        speedChoice &&
        !e.ctrlKey &&
        !e.altKey &&
        !e.metaKey &&
        !isInteractiveElementFocused(e)
      ) {
        setSpeed(speedChoice);
        e.preventDefault();
        return;
      }
      const btn = KEY_MAP[e.code];
      if (!btn || e.ctrlKey || e.altKey || e.metaKey) return;
      if (isInteractiveElementFocused(e)) return;
      heldKeys.add(btn);
      e.preventDefault();
    }

    function handleKeyUp(e) {
      const btn = KEY_MAP[e.code];
      if (!btn) return;
      heldKeys.delete(btn);
    }

    function computeDpadDirs(dpadEl, clientX, clientY) {
      const rect = dpadEl.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return [];
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const radius = Math.min(rect.width, rect.height) / 2;
      if (Math.hypot(dx, dy) < radius * 0.16) return [];
      const dirs = [];
      const ax = Math.abs(dx);
      const ay = Math.abs(dy);
      if (ax >= ay * 0.55) dirs.push(dx > 0 ? 'right' : 'left');
      if (ay >= ax * 0.55) dirs.push(dy > 0 ? 'down' : 'up');
      return dirs;
    }

    function syncTouchButtons({ vibrateOnNew = false } = {}) {
      const next = new Set();
      for (const btns of activeTouchPointers.values()) {
        for (const b of btns) next.add(b);
      }

      let changed = next.size !== heldTouchButtons.size;
      let hasNewPress = false;
      for (const b of next) {
        if (!heldTouchButtons.has(b)) {
          changed = true;
          hasNewPress = true;
        }
      }

      heldTouchButtons.clear();
      for (const b of next) heldTouchButtons.add(b);

      for (const [btn, els] of touchButtonElsByName.entries()) {
        const pressed = heldTouchButtons.has(btn);
        for (const el of els) {
          el.classList.toggle('pressed', pressed);
        }
      }

      if (vibrateOnNew && hasNewPress && typeof navigator.vibrate === 'function') {
        try {
          navigator.vibrate(8);
        } catch {}
      }
      if (changed) {
        emu?.syncInput();
      }
    }

    function clearTouchInput() {
      if (activeTouchPointers.size === 0 && heldTouchButtons.size === 0) return;
      activeTouchPointers.clear();
      syncTouchButtons();
    }

    function isTouchControlsVisible() {
      return touchControlsOverride !== null ? touchControlsOverride : mobileLayoutQuery.matches;
    }

    function syncTouchControlsVisibility() {
      const visible = isTouchControlsVisible();
      touchGamepadEl.hidden = !visible;
      document.body.classList.toggle('touch-controls-visible', visible);
      touchPadBtn.classList.toggle('active', visible);
      touchPadBtn.setAttribute('aria-pressed', visible ? 'true' : 'false');
      if (!visible) {
        clearTouchInput();
      }
    }

    touchPadBtn.addEventListener('click', () => {
      resumeAudioSafely();
      touchControlsOverride = !isTouchControlsVisible();
      syncTouchControlsVisibility();
      blurActiveElement();
    });

    if (typeof mobileLayoutQuery.addEventListener === 'function') {
      mobileLayoutQuery.addEventListener('change', () => {
        if (touchControlsOverride === null) {
          syncTouchControlsVisibility();
        }
      });
    }

    touchGamepadEl.addEventListener('contextmenu', (e) => e.preventDefault());

    touchDpadEl.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resumeAudioSafely();
      try {
        touchDpadEl.setPointerCapture(e.pointerId);
      } catch {}
      activeTouchPointers.set(e.pointerId, new Set(computeDpadDirs(touchDpadEl, e.clientX, e.clientY)));
      syncTouchButtons({ vibrateOnNew: e.pointerType === 'touch' });
    });

    touchDpadEl.addEventListener('pointermove', (e) => {
      if (!activeTouchPointers.has(e.pointerId)) return;
      e.preventDefault();
      activeTouchPointers.set(e.pointerId, new Set(computeDpadDirs(touchDpadEl, e.clientX, e.clientY)));
      syncTouchButtons({ vibrateOnNew: e.pointerType === 'touch' });
    });

    for (const evName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      touchDpadEl.addEventListener(evName, (e) => {
        if (activeTouchPointers.delete(e.pointerId)) {
          syncTouchButtons();
        }
      });
    }

    for (const btnEl of touchDiscreteButtons) {
      const btnName = btnEl.dataset.gbBtn;
      btnEl.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        resumeAudioSafely();
        try {
          btnEl.setPointerCapture(e.pointerId);
        } catch {}
        activeTouchPointers.set(e.pointerId, new Set([btnName]));
        syncTouchButtons({ vibrateOnNew: e.pointerType === 'touch' });
      });
      for (const evName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        btnEl.addEventListener(evName, (e) => {
          if (activeTouchPointers.delete(e.pointerId)) {
            syncTouchButtons();
          }
        });
      }
    }

    function handleWindowBlur() {
      heldKeys.clear();
      clearTouchInput();
    }

    function handleDocumentHidden() {
      clearTouchInput();
      if (autoFight.getState().active) {
        stopAutoFight();
      }
      writeUnloadSnapshot();
      releaseWakeLock();
      if (emu && emu.isPlaying && !isBusy) {
        emu.pause();
        syncControls();
        flushEmulatorPersistence();
      }
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);
    window.addEventListener('blur', handleWindowBlur);
    window.addEventListener('pointerdown', resumeAudioSafely, { passive: true });
    window.addEventListener('touchstart', resumeAudioSafely, { passive: true });
    window.addEventListener('touchend', resumeAudioSafely, { passive: true });
    window.addEventListener('pagehide', () => {
      writeUnloadSnapshot();
      if (pipWindow && !pipWindow.closed) {
        try {
          pipWindow.close();
        } catch {}
      }
    });
    window.addEventListener('beforeunload', writeUnloadSnapshot);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        if (isMiniPlayerOpen()) {
          writeUnloadSnapshot();
          return;
        }
        handleDocumentHidden();
      } else if (document.visibilityState === 'visible') {
        clearTimeout(pipHiddenPauseTimer);
        pipHiddenPauseTimer = 0;
        if (emu?.isPlaying) {
          requestWakeLock();
        }
      }
    });

    let dragDepth = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragDepth++;
      document.body.classList.add('dragging');
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) document.body.classList.remove('dragging');
    });
    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragDepth = 0;
      document.body.classList.remove('dragging');
      const file = e.dataTransfer?.files?.[0];
      if (file) await loadRom(file, file.name, { persist: true });
    });

    try {
      binjgb = await Binjgb({ locateFile: (path) => `./vendor/binjgb/${path}` });
    } catch (err) {
      console.error(err);
      statusEl.textContent = `Failed to initialize emulator: ${err?.message || err}`;
      throw err;
    }

    const params = new URLSearchParams(window.location.search);
    const romUrl = params.get('rom');
    if (romUrl) {
      loadRom(romUrl, romUrl.split('/').pop());
    } else {
      dbGet(LAST_ROM_KEY).then((record) => {
        if (record?.bytes && record?.name && !emu) {
          loadRom(new File([record.bytes], record.name), record.name);
        }
      });
    }

    syncTouchControlsVisibility();
    syncMiniPlayerButton();

    window.__retroIdle = {
      getEmulator: () => emu,
      loadRom,
      getSpeed: () => currentSpeed,
      setSpeed,
      getTouchControls: () => ({
        visible: !touchGamepadEl.hidden,
        held: Array.from(heldTouchButtons).sort(),
        setVisible: (val) => {
          touchControlsOverride = val === null ? null : Boolean(val);
          syncTouchControlsVisibility();
        },
      }),
      getMiniPlayer: () => ({
        supported: SUPPORTS_DOCUMENT_PIP,
        open: isMiniPlayerOpen(),
        openWindow: openMiniPlayer,
        closeWindow: () => teardownMiniPlayer({ closeWindow: true }),
        getWindow: () => (isMiniPlayerOpen() ? pipWindow : null),
      }),
      getAutoFight: () => ({
        ...autoFight.getState(),
        profile: currentAutoFightProfile?.id ?? null,
        supported: Boolean(emu && currentAutoFightProfile),
        start: startAutoFight,
        stop: stopAutoFight,
        clearTrail: () => autoFight.clearTrail(),
        snapshot: () =>
          emu && currentAutoFightProfile
            ? currentAutoFightProfile.readSnapshot((a) => emu.readMem(a))
            : null,
      }),
    };
  </script>
</body>
</html>
