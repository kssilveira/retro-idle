  <title>retro-idle — Game Boy &amp; GBA Emulator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1120'/%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='none' stroke='%231e293b' stroke-width='2'/%3E%3Crect x='6' y='6' width='20' height='15' rx='2' fill='%2388c070'/%3E%3Crect x='8' y='8' width='16' height='11' fill='%23e0f8d0'/%3E%3Ccircle cx='23' cy='25' r='2' fill='%2338bdf8'/%3E%3Crect x='7' y='24' width='6' height='2' rx='1' fill='%2394a3b8'/%3E%3Crect x='9' y='22' width='2' height='6' rx='1' fill='%2394a3b8'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --screen-w: 160;
      --screen-h: 144;
    }

    body.gba-mode {
      --screen-w: 240;
      --screen-h: 160;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      touch-action: manipulation;
      transition: outline-color 120ms ease;
    }

    button,
    .file-label,
    .touch-gamepad,
    .touch-gamepad * {
      -webkit-tap-highlight-color: transparent;
    }

    body.dragging {
      outline: 3px dashed var(--accent);
      outline-offset: -10px;
    }

    main {
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .screen-slot {
      width: min(480px, 100%);
      aspect-ratio: var(--screen-w) / var(--screen-h);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #screen {
      width: 100%;
      height: 100%;
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 6px;
      image-rendering: pixelated;
      display: block;
    }

    .pip-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      background: #0f172a;
      border: 2px dashed var(--border);
      border-radius: 6px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }

    .pip-placeholder[hidden] {
      display: none;
    }

    .pip-placeholder p {
      margin: 0;
    }

    .controls {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .file-label,
    button {
      font: inherit;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      cursor: pointer;
    }

    .file-label:hover,
    button:not(:disabled):hover {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.active {
      border-color: var(--accent);
      background: #0c4a6e;
    }

    .speed-controls {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }

    .speed-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-right: 2px;
    }

    .speed-btn {
      font-size: 0.825rem;
      padding: 5px 10px;
      min-width: 44px;
    }

    #rom-input,
    #sav-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #status {
      width: 100%;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
      min-height: 1.25em;
    }

    #auto-fight-status {
      width: 100%;
      text-align: center;
      font-size: 0.825rem;
      color: var(--accent);
      min-height: 1.2em;
    }

    #auto-fight-status.error {
      color: #f87171;
    }

    #heal-center-status {
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.15em;
    }

    #heal-center-status.linked {
      color: #34d399;
    }

    .legend {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    kbd {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.75rem;
      color: var(--text);
    }

    .touch-gamepad {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "shoulders shoulders"
        "dpad ab"
        "meta meta";
      align-items: center;
      justify-items: center;
      row-gap: 14px;
      column-gap: 12px;
      width: 100%;
      padding: 6px 4px 2px;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .pad-shoulders {
      grid-area: shoulders;
      width: 100%;
      display: none;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px;
      pointer-events: none;
    }

    body.gba-mode .pad-shoulders {
      display: flex;
    }

    .gb-shoulder-btn {
      pointer-events: auto;
      min-width: 68px;
      min-height: 28px;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      touch-action: none;
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--muted);
      transition: transform 60ms ease, background-color 60ms ease, border-color 60ms ease, color 60ms ease;
    }

    .gb-shoulder-btn.pressed {
      background: #0c4a6e;
      border-color: var(--accent);
      color: #f8fafc;
      transform: scale(0.95);
    }

    .pad-left {
      grid-area: dpad;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pad-right {
      grid-area: ab;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pad-center {
      grid-area: meta;
      display: flex;
      gap: 18px;
      justify-content: center;
      align-items: center;
    }

    .dpad {
      --dpad-size: 138px;
      --dpad-arm: 46px;
      position: relative;
      width: var(--dpad-size);
      height: var(--dpad-size);
      touch-action: none;
    }

    .dpad-arm {
      position: absolute;
      display: grid;
      place-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1;
      pointer-events: none;
      transition: background-color 60ms ease, border-color 60ms ease, color 60ms ease;
    }

    .dpad-up {
      top: 0;
      left: var(--dpad-arm);
      width: var(--dpad-arm);
      height: calc(var(--dpad-arm) + 2px);
      border-radius: 8px 8px 0 0;
    }

    .dpad-down {
      bottom: 0;
      left: var(--dpad-arm);
      width: var(--dpad-arm);
      height: calc(var(--dpad-arm) + 2px);
      border-radius: 0 0 8px 8px;
    }

    .dpad-left {
      left: 0;
      top: var(--dpad-arm);
      width: calc(var(--dpad-arm) + 2px);
      height: var(--dpad-arm);
      border-radius: 8px 0 0 8px;
    }

    .dpad-right {
      right: 0;
      top: var(--dpad-arm);
      width: calc(var(--dpad-arm) + 2px);
      height: var(--dpad-arm);
      border-radius: 0 8px 8px 0;
    }

    .dpad-center {
      position: absolute;
      top: var(--dpad-arm);
      left: var(--dpad-arm);
      width: var(--dpad-arm);
      height: var(--dpad-arm);
      background: #1e293b;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .dpad-center::after {
      content: '';
      width: 48%;
      height: 48%;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid #334155;
    }

    .dpad-arm.pressed {
      background: #0c4a6e;
      border-color: var(--accent);
      color: #f8fafc;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    }

    .ab-cluster {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .gb-action-btn {
      width: 60px;
      height: 60px;
      padding: 0;
      border-radius: 50%;
      font-weight: 700;
      font-size: 1.05rem;
      touch-action: none;
      background: #7f1d1d;
      border: 2px solid #b91c1c;
      color: #fecaca;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35);
      transition: transform 60ms ease, background-color 60ms ease, border-color 60ms ease;
    }

    .gb-action-btn:not(:disabled):hover {
      border-color: #ef4444;
    }

    .gb-btn-b {
      margin-top: 24px;
    }

    .gb-btn-a {
      margin-bottom: 24px;
    }

    .gb-action-btn.pressed {
      background: #dc2626;
      border-color: #fca5a5;
      color: #ffffff;
      transform: scale(0.95);
    }

    .gb-meta-btn {
      min-width: 72px;
      min-height: 32px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      touch-action: none;
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--muted);
      transition: transform 60ms ease, background-color 60ms ease, border-color 60ms ease, color 60ms ease;
    }

    .gb-meta-btn.pressed {
      background: #0c4a6e;
      border-color: var(--accent);
      color: #f8fafc;
      transform: scale(0.95);
    }

    @media (pointer: coarse) {
      .legend {
        display: none;
      }
    }

    @media (max-width: 768px), (pointer: coarse) {
      body {
        padding:
          max(8px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));
        align-content: start;
      }

      main {
        width: 100%;
        padding: 12px;
        gap: 10px;
        border-radius: 10px;
      }

      h1 {
        order: 1;
        font-size: 0.95rem;
      }

      .screen-slot {
        order: 2;
        width: min(100%, calc((100dvh - 370px) * var(--screen-w) / var(--screen-h)));
        min-width: min(100%, 240px);
      }

      #status {
        order: 3;
        font-size: 0.8rem;
      }

      #auto-fight-status {
        order: 4;
        font-size: 0.78rem;
      }

      #heal-center-status {
        order: 5;
        font-size: 0.76rem;
      }

      .touch-gamepad {
        order: 6;
      }

      .speed-controls {
        order: 7;
      }

      .controls {
        order: 8;
        gap: 6px;
      }

      .legend {
        order: 9;
      }

      .controls button,
      .controls .file-label {
        padding: 7px 11px;
        font-size: 0.82rem;
      }

      .speed-btn {
        padding: 5px 9px;
        min-width: 40px;
      }
    }

    @media (orientation: landscape) and (max-height: 540px) {
      body.touch-controls-visible {
        padding:
          max(4px, env(safe-area-inset-top))
          max(8px, env(safe-area-inset-right))
          max(6px, env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
        align-content: start;
      }

      body.touch-controls-visible main {
        width: 100%;
        max-width: 100%;
        padding: 4px 6px;
        background: transparent;
        border: none;
        border-radius: 0;
        display: grid;
        grid-template-columns: minmax(140px, 1fr) auto minmax(140px, 1fr);
        align-items: center;
        justify-items: center;
        column-gap: 10px;
        row-gap: 6px;
      }

      body.touch-controls-visible main > h1,
      body.touch-controls-visible main > .legend {
        display: none;
      }

      body.touch-controls-visible .screen-slot {
        grid-column: 2;
        grid-row: 1;
        order: initial;
        width: min(calc(100vw - 310px), calc((100dvh - 58px) * var(--screen-w) / var(--screen-h)), 420px);
        min-width: 0;
        height: auto;
        aspect-ratio: var(--screen-w) / var(--screen-h);
      }

      body.touch-controls-visible .touch-gamepad {
        display: contents;
      }

      body.touch-controls-visible .pad-shoulders {
        grid-column: 1 / -1;
        grid-row: 2;
        z-index: 1;
        padding: 0 10px;
      }

      body.touch-controls-visible .pad-left {
        grid-column: 1;
        grid-row: 1;
      }

      body.touch-controls-visible .pad-right {
        grid-column: 3;
        grid-row: 1;
      }

      body.touch-controls-visible .pad-center {
        grid-column: 2;
        grid-row: 2;
        z-index: 2;
        gap: 14px;
      }

      body.touch-controls-visible #status,
      body.touch-controls-visible #auto-fight-status,
      body.touch-controls-visible #heal-center-status,
      body.touch-controls-visible .speed-controls,
      body.touch-controls-visible .controls {
        grid-column: 1 / -1;
        order: initial;
      }
    }

    @media (orientation: landscape) and (max-height: 400px) {
      body.touch-controls-visible .dpad {
        --dpad-size: 126px;
        --dpad-arm: 42px;
      }

      body.touch-controls-visible .gb-action-btn {
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>retro-idle</h1>
    <div id="screen-slot" class="screen-slot">
      <canvas id="screen" width="160" height="144"></canvas>
      <div id="pip-placeholder" class="pip-placeholder" hidden>
        <p>Playing in Mini-Player</p>
        <button type="button" id="pip-return-btn">Return to Tab</button>
      </div>
    </div>

    <div class="controls">
      <label class="file-label" for="rom-input">Load ROM (.gb / .gbc / .gba)</label>
      <input type="file" id="rom-input" accept=".gb,.gbc,.gba" />
      <button type="button" id="toggle-play" disabled>Pause</button>
      <button type="button" id="reset-btn" disabled>Reset</button>
      <button type="button" id="save-state-btn" disabled>Save State</button>
      <button type="button" id="load-state-btn" disabled>Load State</button>
      <button type="button" id="export-sav-btn" disabled>Export .sav</button>
      <button type="button" id="import-sav-btn" disabled>Import .sav</button>
      <input type="file" id="sav-input" accept=".sav" />
      <button type="button" id="auto-fight-btn" aria-pressed="false" disabled title="Pokémon Red / Blue / Yellow / Crystal / Emerald">Auto-Fight</button>
      <button type="button" id="mute-btn" class="active" aria-pressed="true" title="Unmute audio (M)">Unmute</button>
      <button type="button" id="touch-pad-btn" aria-pressed="false" title="Show or hide on-screen controls">Touch Pad</button>
      <button type="button" id="mini-player-btn" disabled title="Pop out always-on-top mini-player (Chrome / Edge desktop)">Mini-Player</button>
    </div>

    <div class="speed-controls" id="speed-controls" role="group" aria-label="Emulator speed">
      <span class="speed-label">Speed</span>
      <button type="button" class="speed-btn active" data-speed="1" aria-pressed="true">1x</button>
      <button type="button" class="speed-btn" data-speed="2" aria-pressed="false" title="Audio muted above 1x">2x</button>
      <button type="button" class="speed-btn" data-speed="4" aria-pressed="false" title="Audio muted above 1x">4x</button>
      <button type="button" class="speed-btn" data-speed="10" aria-pressed="false" title="Audio muted above 1x">10x</button>
      <button type="button" class="speed-btn" data-speed="20" aria-pressed="false" title="Audio muted above 1x">20x</button>
    </div>

    <div id="status">Drop a .gb / .gbc / .gba ROM anywhere or click Load ROM.</div>
    <div id="auto-fight-status" hidden></div>
    <div id="heal-center-status" hidden></div>

    <section id="touch-gamepad" class="touch-gamepad" aria-label="Gamepad controls" hidden>
      <div class="pad-shoulders">
        <button type="button" class="gb-shoulder-btn" data-gb-btn="l" aria-label="L shoulder button">L</button>
        <button type="button" class="gb-shoulder-btn" data-gb-btn="r" aria-label="R shoulder button">R</button>
      </div>
      <div class="pad-left">
        <div id="touch-dpad" class="dpad" role="group" aria-label="D-Pad">
          <div class="dpad-arm dpad-up" data-gb-btn="up" aria-hidden="true">&#9650;</div>
          <div class="dpad-arm dpad-down" data-gb-btn="down" aria-hidden="true">&#9660;</div>
          <div class="dpad-arm dpad-left" data-gb-btn="left" aria-hidden="true">&#9664;</div>
          <div class="dpad-arm dpad-right" data-gb-btn="right" aria-hidden="true">&#9654;</div>
          <div class="dpad-center" aria-hidden="true"></div>
        </div>
      </div>
      <div class="pad-right">
        <div class="ab-cluster">
          <button type="button" class="gb-action-btn gb-btn-b" data-gb-btn="b" aria-label="B button">B</button>
          <button type="button" class="gb-action-btn gb-btn-a" data-gb-btn="a" aria-label="A button">A</button>
        </div>
      </div>
      <div class="pad-center">
        <button type="button" class="gb-meta-btn" data-gb-btn="select">SELECT</button>
        <button type="button" class="gb-meta-btn" data-gb-btn="start">START</button>
      </div>
    </section>

    <p class="legend">
      D-Pad: <kbd>Arrows</kbd> or <kbd>WASD</kbd> &middot;
      A: <kbd>X</kbd> &middot;
      B: <kbd>Z</kbd> &middot;
      L/R: <kbd>Q</kbd>/<kbd>E</kbd> &middot;
      Start: <kbd>Enter</kbd> &middot;
      Select: <kbd>Shift</kbd> &middot;
      Speed: <kbd>1</kbd>&ndash;<kbd>5</kbd> &middot;
      Mute: <kbd>M</kbd> &middot;
      Gamepad supported
    </p>
  </main>

  <script src="./vendor/binjgb/binjgb.js"></script>
  <script type="module">
    import {
      createAutoFight,
      getAutoFightProfile,
    } from './autofight.js';

    const SCREEN_WIDTH = 160;
    const SCREEN_HEIGHT = 144;
    const GBA_WIDTH = 240;
    const GBA_HEIGHT = 160;
    const GBA_CPU_TICKS_PER_SECOND = 16777216;
    const GBA_CYCLES_PER_FRAME = 280896;
    const GBA_FRAME_SEC = GBA_CYCLES_PER_FRAME / GBA_CPU_TICKS_PER_SECOND;
    const GBA_AUDIO_STAGE_FRAMES = 1024;
    const GBA_KEY_BITS = {
      a: 1 << 0,
      b: 1 << 1,
      select: 1 << 2,
      start: 1 << 3,
      right: 1 << 4,
      left: 1 << 5,
      up: 1 << 6,
      down: 1 << 7,
      r: 1 << 8,
      l: 1 << 9,
    };
    const AUDIO_FRAMES = 4096;
    const DEFAULT_AUDIO_SAMPLE_RATE = 44100;
    const AUDIO_LATENCY_SEC = 0.1;
    const MAX_UPDATE_SEC = 5 / 60;

    function bytesToBase64(bytes) {
      const chunks = [];
      for (let i = 0; i < bytes.length; i += 0x8000) {
        chunks.push(String.fromCharCode(...bytes.subarray(i, i + 0x8000)));
      }
      return btoa(chunks.join(''));
    }

    function base64ToBytes(b64) {
      return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    }

    const CRC_TABLE = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_TABLE[i] = c >>> 0;
    }
    function crc32Hex(bytes) {
      let crc = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
      return ((crc ^ 0xffffffff) >>> 0).toString(16).padStart(8, '0');
    }
