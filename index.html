<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>retro-idle — Game Boy Emulator</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      transition: outline-color 120ms ease;
    }

    body.dragging {
      outline: 3px dashed var(--accent);
      outline-offset: -10px;
    }

    main {
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #screen {
      width: min(480px, 100%);
      aspect-ratio: 160 / 144;
      height: auto;
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 6px;
      image-rendering: pixelated;
      display: block;
    }

    .controls {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .file-label,
    button {
      font: inherit;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      cursor: pointer;
    }

    .file-label:hover,
    button:not(:disabled):hover {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #rom-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #status {
      width: 100%;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
      min-height: 1.25em;
    }

    .legend {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    kbd {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.75rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <h1>retro-idle</h1>
    <canvas id="screen" width="160" height="144"></canvas>

    <div class="controls">
      <label class="file-label" for="rom-input">Load ROM (.gb / .gbc / .zip)</label>
      <input type="file" id="rom-input" accept=".gb,.gbc,.zip" />
      <button type="button" id="toggle-play" disabled>Pause</button>
      <button type="button" id="reset-btn" disabled>Reset</button>
      <button type="button" id="save-state-btn" disabled>Save State</button>
      <button type="button" id="load-state-btn" disabled>Load State</button>
    </div>

    <div id="status">Drop a .gb / .gbc ROM anywhere or click Load ROM.</div>

    <p class="legend">
      D-Pad: <kbd>Arrows</kbd> or <kbd>WASD</kbd> &middot;
      A: <kbd>X</kbd> &middot;
      B: <kbd>Z</kbd> &middot;
      Start: <kbd>Enter</kbd> &middot;
      Select: <kbd>Shift</kbd> &middot;
      Gamepad supported
    </p>
  </main>

  <script type="module">
    const WASMBOY_URL = 'https://cdn.jsdelivr.net/npm/wasmboy@0.7.1/dist/wasmboy.wasm.esm.js';

    const canvas = document.getElementById('screen');
    const romInput = document.getElementById('rom-input');
    const togglePlayBtn = document.getElementById('toggle-play');
    const resetBtn = document.getElementById('reset-btn');
    const saveStateBtn = document.getElementById('save-state-btn');
    const loadStateBtn = document.getElementById('load-state-btn');
    const statusEl = document.getElementById('status');

    function base64ToBytes(b64) {
      return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    }

    function bytesToBase64(bytes) {
      const chunks = [];
      for (let i = 0; i < bytes.length; i += 0x8000) {
        chunks.push(String.fromCharCode(...bytes.subarray(i, i + 0x8000)));
      }
      return btoa(chunks.join(''));
    }

    function findUniqueSubarray(haystack, needle) {
      let matchIdx = -1;
      for (let i = 0; i <= haystack.length - needle.length; i++) {
        let matched = true;
        for (let j = 0; j < needle.length; j++) {
          if (haystack[i + j] !== needle[j]) {
            matched = false;
            break;
          }
        }
        if (matched) {
          if (matchIdx !== -1) {
            throw new Error('Ambiguous WasmBoy patch target');
          }
          matchIdx = i;
        }
      }
      if (matchIdx === -1) {
        throw new Error('Could not locate WasmBoy patch target');
      }
      return matchIdx;
    }

    async function loadPatchedWasmBoy() {
      const res = await fetch(WASMBOY_URL);
      if (!res.ok) {
        throw new Error(`Failed to fetch WasmBoy (${res.status})`);
      }
      let source = await res.text();

      const workerUrls = source.match(/data:application\/javascript;base64,[A-Za-z0-9+/=]+/g) || [];
      let patchedWorker = false;

      for (const workerUrl of workerUrls) {
        const prefix = 'data:application/javascript;base64,';
        let workerJs = atob(workerUrl.slice(prefix.length));
        const wasmMatch = workerJs.match(/data:application\/wasm;base64,([A-Za-z0-9+/=]+)/);
        if (!wasmMatch) continue;

        const wasmBytes = base64ToBytes(wasmMatch[1]);
        // Fix 5 upstream wasmboy@0.7.1 loadState() slot typos (passing variable instead of saveStateSlot)
        const wasmPatches = [
          { expected: [0x23, 0x49, 0x41, 0x32, 0x6c, 0x41, 0x80, 0x08, 0x6a], replace: [0x41, 0x07] },
          { expected: [0x23, 0x63, 0x41, 0x32, 0x6c, 0x41, 0x80, 0x08, 0x6a], replace: [0x41, 0x08] },
          { expected: [0x23, 0xea, 0x01, 0x41, 0x32, 0x6c, 0x41, 0x84, 0x08, 0x6a], replace: [0x41, 0x01, 0x01] },
          { expected: [0x23, 0x76, 0x41, 0x32, 0x6c, 0x41, 0x80, 0x08, 0x6a], replace: [0x41, 0x09] },
          { expected: [0x23, 0x85, 0x01, 0x41, 0x32, 0x6c, 0x41, 0x80, 0x08, 0x6a], replace: [0x41, 0x0a, 0x01] },
        ];
        for (const p of wasmPatches) {
          const idx = findUniqueSubarray(wasmBytes, p.expected);
          wasmBytes.set(p.replace, idx);
        }
        if (!WebAssembly.validate(wasmBytes)) {
          throw new Error('Patched WasmBoy WASM core failed validation');
        }

        workerJs = workerJs.replace(wasmMatch[0], `data:application/wasm;base64,${bytesToBase64(wasmBytes)}`);
        source = source.replace(workerUrl, `${prefix}${btoa(workerJs)}`);
        patchedWorker = true;
        break;
      }

      if (!patchedWorker) {
        throw new Error('Could not locate WasmBoy WASM worker');
      }

      // Wrap raw ArrayBuffers returned by GET_MEMORY after loadState() in Uint8Array
      const loadStateAssignTarget =
        'this.cartridgeRam=a.message[u.CARTRIDGE_RAM];this.gameboyMemory=a.message[u.GAMEBOY_MEMORY];this.paletteMemory=a.message[u.PALETTE_MEMORY];this.internalState=a.message[u.INTERNAL_STATE]';
      const loadStateAssignFixed =
        'this.cartridgeRam=new Uint8Array(a.message[u.CARTRIDGE_RAM]);this.gameboyMemory=new Uint8Array(a.message[u.GAMEBOY_MEMORY]);this.paletteMemory=new Uint8Array(a.message[u.PALETTE_MEMORY]);this.internalState=new Uint8Array(a.message[u.INTERNAL_STATE])';
      if (!source.includes(loadStateAssignTarget)) {
        throw new Error('Could not locate WasmBoy loadState memory assignment');
      }
      source = source.replace(loadStateAssignTarget, loadStateAssignFixed);

      const blobUrl = URL.createObjectURL(new Blob([source], { type: 'application/javascript' }));
      try {
        const mod = await import(blobUrl);
        return mod.WasmBoy;
      } finally {
        URL.revokeObjectURL(blobUrl);
      }
    }

    let WasmBoy;
    try {
      WasmBoy = await loadPatchedWasmBoy();
    } catch (err) {
      console.error(err);
      statusEl.textContent = `Failed to initialize emulator: ${err?.message || err}`;
      throw err;
    }

    const CARTRIDGE_TYPES = {
      0x00: 'ROM ONLY',
      0x01: 'MBC1',
      0x02: 'MBC1 + RAM',
      0x03: 'MBC1 + RAM + BATTERY',
      0x05: 'MBC2',
      0x06: 'MBC2 + BATTERY',
      0x0f: 'MBC3 + TIMER + BATTERY',
      0x10: 'MBC3 + TIMER + RAM + BATTERY',
      0x11: 'MBC3',
      0x12: 'MBC3 + RAM',
      0x13: 'MBC3 + RAM + BATTERY',
      0x19: 'MBC5',
      0x1a: 'MBC5 + RAM',
      0x1b: 'MBC5 + RAM + BATTERY',
      0x1c: 'MBC5 + RUMBLE',
      0x1d: 'MBC5 + RUMBLE + RAM',
      0x1e: 'MBC5 + RUMBLE + RAM + BATTERY',
    };

    let currentHeaderText = '';
    let hasLoadedRom = false;
    let hasManualSave = false;
    let isBusy = false;

    function blurActiveElement() {
      if (document.activeElement instanceof HTMLElement) {
        document.activeElement.blur();
      }
    }

    function setActionButtonsDisabled() {
      togglePlayBtn.disabled = !hasLoadedRom || isBusy;
      resetBtn.disabled = !hasLoadedRom || isBusy;
      saveStateBtn.disabled = !hasLoadedRom || isBusy;
      loadStateBtn.disabled = !hasLoadedRom || !hasManualSave || isBusy;
    }

    function syncControls(statusSuffix = '') {
      setActionButtonsDisabled();
      if (!hasLoadedRom) {
        togglePlayBtn.textContent = 'Pause';
        return;
      }
      const playing = WasmBoy.isPlaying();
      togglePlayBtn.textContent = playing ? 'Pause' : 'Resume';
      statusEl.textContent = `${playing ? 'Playing' : 'Paused'}: ${currentHeaderText}${statusSuffix}`;
    }

    function isValidSaveState(state) {
      const mem = state?.wasmboyMemory;
      return Boolean(
        mem &&
        mem.cartridgeRam?.buffer &&
        mem.gameBoyMemory?.buffer &&
        mem.wasmBoyPaletteMemory?.buffer &&
        mem.wasmBoyInternalState?.buffer &&
        mem.wasmBoyInternalState.byteLength > 0
      );
    }

    async function getLatestSaveState(isAuto) {
      const states = (await WasmBoy.getSaveStates()) || [];
      return (
        states
          .filter((s) => Boolean(s?.isAuto) === isAuto && isValidSaveState(s))
          .sort((a, b) => (a.date || 0) - (b.date || 0))
          .at(-1) || null
      );
    }

    async function restoreLatestAutoSave() {
      try {
        const latestAutoSave = await getLatestSaveState(true);
        if (!latestAutoSave) {
          return false;
        }

        await WasmBoy.loadState(latestAutoSave);
        return true;
      } catch (err) {
        console.warn('Could not restore auto-save state:', err);
        return false;
      }
    }

    function parseRomHeader(bytes) {
      if (!bytes || bytes.length < 0x0150) {
        return null;
      }
      let title = '';
      for (let i = 0x0134; i <= 0x0142; i++) {
        const ch = bytes[i];
        if (ch === 0) break;
        if (ch >= 0x20 && ch <= 0x7e) {
          title += String.fromCharCode(ch);
        }
      }
      title = title.trim() || 'UNKNOWN';
      const typeCode = bytes[0x0147];
      const mbc = CARTRIDGE_TYPES[typeCode] || `TYPE 0x${typeCode.toString(16).padStart(2, '0').toUpperCase()}`;
      return { title, mbc, typeCode };
    }

    async function extractHeader(romSource, fileName) {
      if (romSource instanceof Uint8Array) {
        return parseRomHeader(romSource);
      }
      if (romSource instanceof Blob && !String(fileName || '').toLowerCase().endsWith('.zip')) {
        const slice = await romSource.slice(0, 0x0150).arrayBuffer();
        return parseRomHeader(new Uint8Array(slice));
      }
      return null;
    }

    function resumeAudioSafely() {
      try {
        const result = WasmBoy.resumeAudioContext();
        if (result && typeof result.catch === 'function') {
          result.catch(() => {});
        }
      } catch {
        // Ignore audio context autoplay restrictions until user gesture
      }
    }

    const ROM_DB_NAME = 'retro-idle';
    const ROM_STORE_NAME = 'kv';
    const LAST_ROM_KEY = 'lastRom';

    function openRomDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(ROM_DB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(ROM_STORE_NAME)) {
            req.result.createObjectStore(ROM_STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveLastRom(blob, name) {
      let db;
      try {
        const bytes = new Uint8Array(await blob.arrayBuffer());
        db = await openRomDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(ROM_STORE_NAME, 'readwrite');
          tx.objectStore(ROM_STORE_NAME).put({ bytes, name, savedAt: Date.now() }, LAST_ROM_KEY);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        });
      } catch (err) {
        console.warn('Could not persist last ROM:', err);
      } finally {
        db?.close();
      }
    }

    async function loadLastRom() {
      let db;
      try {
        db = await openRomDb();
        const record = await new Promise((resolve, reject) => {
          const tx = db.transaction(ROM_STORE_NAME, 'readonly');
          const req = tx.objectStore(ROM_STORE_NAME).get(LAST_ROM_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
        if (!record?.bytes || !record?.name) {
          return null;
        }
        return new File([record.bytes], record.name);
      } catch (err) {
        console.warn('Could not load saved ROM:', err);
        return null;
      } finally {
        db?.close();
      }
    }

    async function loadRom(romSource, fileName, { persist = false } = {}) {
      if (!romSource || isBusy) return;
      const label = fileName || (romSource instanceof File ? romSource.name : 'ROM');
      let loadStatusSuffix = '';
      isBusy = true;
      syncControls();
      statusEl.textContent = `Loading ${label}...`;

      try {
        resumeAudioSafely();
        await WasmBoy.config(
          {
            headless: false,
            isAudioEnabled: true,
            isGbcEnabled: true,
            isGbcColorizationEnabled: true,
            enableBootROMIfAvailable: false,
            onPause: () => {
              if (hasLoadedRom && !isBusy) syncControls();
            },
            onPlay: () => {
              if (hasLoadedRom && !isBusy) syncControls();
            },
          },
          canvas
        );

        await WasmBoy.loadROM(romSource);
        if (persist && romSource instanceof Blob) {
          await saveLastRom(romSource, label);
        }
        const restoredAutoSave = await restoreLatestAutoSave();
        hasManualSave = Boolean(await getLatestSaveState(false).catch(() => null));
        await WasmBoy.play();

        const header = await extractHeader(romSource, label);
        currentHeaderText = header ? `${header.title} (${header.mbc})` : label;
        loadStatusSuffix = restoredAutoSave ? ' — resumed auto-save' : '';
        hasLoadedRom = true;
      } catch (err) {
        console.error(err);
        statusEl.textContent = `Failed to load ROM: ${err?.message || err}`;
      } finally {
        isBusy = false;
        if (hasLoadedRom && !statusEl.textContent.startsWith('Failed')) {
          syncControls(loadStatusSuffix);
        } else {
          setActionButtonsDisabled();
        }
        blurActiveElement();
      }
    }

    romInput.addEventListener('change', async () => {
      const file = romInput.files && romInput.files[0];
      romInput.value = '';
      if (file) {
        await loadRom(file, file.name, { persist: true });
      } else {
        blurActiveElement();
      }
    });

    async function runTransportAction(action) {
      if (isBusy || !hasLoadedRom) return;
      isBusy = true;
      setActionButtonsDisabled();
      let statusSuffix = '';
      let hadError = false;
      try {
        resumeAudioSafely();
        statusSuffix = (await action()) || '';
      } catch (err) {
        hadError = true;
        console.error(err);
        statusEl.textContent = `Action failed: ${err?.message || err || 'emulator worker timed out'}`;
      } finally {
        isBusy = false;
        if (hadError) {
          setActionButtonsDisabled();
        } else {
          syncControls(statusSuffix);
        }
        blurActiveElement();
      }
    }

    togglePlayBtn.addEventListener('click', () =>
      runTransportAction(() => (WasmBoy.isPlaying() ? WasmBoy.pause() : WasmBoy.play()))
    );

    resetBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        await WasmBoy.reset();
        await WasmBoy.play();
      })
    );

    saveStateBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        const wasPlaying = WasmBoy.isPlaying();
        await WasmBoy.saveState();
        hasManualSave = true;
        if (wasPlaying) {
          await WasmBoy.play();
        }
        return ' — state saved';
      })
    );

    loadStateBtn.addEventListener('click', () =>
      runTransportAction(async () => {
        const manualSave = await getLatestSaveState(false);
        if (!manualSave) {
          hasManualSave = false;
          return '';
        }
        await WasmBoy.loadState(manualSave);
        await WasmBoy.play();
        return ' — state loaded';
      })
    );

    let dragDepth = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragDepth++;
      document.body.classList.add('dragging');
    });
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
    });
    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) {
        document.body.classList.remove('dragging');
      }
    });
    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragDepth = 0;
      document.body.classList.remove('dragging');
      const file = e.dataTransfer?.files?.[0];
      if (file) {
        await loadRom(file, file.name, { persist: true });
      }
    });

    window.addEventListener('pointerdown', resumeAudioSafely, { passive: true });
    window.addEventListener('keydown', resumeAudioSafely, { passive: true });

    const params = new URLSearchParams(window.location.search);
    const romUrl = params.get('rom');
    if (romUrl) {
      loadRom(romUrl, romUrl.split('/').pop());
    } else {
      loadLastRom().then((savedFile) => {
        if (savedFile && !hasLoadedRom) {
          loadRom(savedFile, savedFile.name);
        }
      });
    }

    window.__retroIdle = { WasmBoy, loadRom };
  </script>
</body>
</html>
